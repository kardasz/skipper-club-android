asyncapi: 3.0.0
info:
  title: Skipper Club WebSocket API
  version: 1.0.0
  description: |
    Real-time WebSocket API for the Skipper Club sailing social platform.
    Provides live chat messaging, typing indicators, presence tracking and
    real-time notifications for all types of conversations including private
    chats, group chats, and cruise-related communications.

    The transport is a plain RFC 6455 WebSocket (not Socket.IO). Every wire
    message is a JSON text frame shaped as
    {"event":"<message name>","data":<documented message payload>}.
    Component payload schemas below describe the `data` member of that envelope.

    ## Transport parity (REST + WebSocket)

    Chat writes have two equivalent entrypoints — the WS events below and
    the REST endpoints in api/openapi.yaml — and both produce identical
    server-emitted events:

    - Creating a message (WS message:send or REST
      POST /chats/{chatId}/messages) emits message:new to the chat room and
      message:received to every other participant's personal room. Both
      transports accept an optional clientMessageId idempotency key: a
      retried send returns the already-created message and emits no second
      fan-out.
    - Marking a message read (WS message:read or REST
      PATCH /chats/{chatId}/messages/{messageId} with read=true) broadcasts
      the message:read receipt to the chat room.
    - Bulk mark-read (REST POST /chats/actions with action=mark-read)
      broadcasts one message:read receipt per chat where at least one message
      actually transitioned unread→read, carrying the newest newly-marked
      message in that chat. Chats with nothing newly marked emit no event.

    Read receipts are cascading: a message:read receipt for message M by
    user U means U has read M and every earlier message in that chat.

    Only the acknowledgement differs: WS callers get the reply events —
    message:sent carrying the created message object (identical shape to
    message:new) and the empty message:read:confirmed — while REST callers
    get the HTTP response instead. Marking a message unread emits no
    WebSocket events. Hiding a chat (REST DELETE /chats/{chatId}, or the
    delete bulk action on POST /chats/actions) emits no event either, but
    the server evicts the hider's connections from that chat's room, so no
    further room events (message:new, chat:typing, message:read) reach them.

    ## Errors

    Failed client operations produce an `error` event with generic text
    (never REST problem details):

    - "Invalid payload" — input validation failed: malformed payload JSON, a
      bad or wrong-version UUID, a wrong text length, or a missing required
      field. Frames that are not a well-formed envelope produce one such error
      per streak (like "Rate limit exceeded"), reset by the next well-formed
      frame; per-handler validation failures are reported per frame.
    - "Chat not found or access denied" / "Message not found or access
      denied" — the access checks deliberately collapse "does not exist" and
      "not yours to touch" into one message.
    - "Rate limit exceeded" — see Rate limiting.
    - "Internal server error" — an unexpected server-side failure.

    ## Connection lifecycle

    - One connection serves chat and notifications; every authenticated
      connection automatically joins its personal room (user:{userId}).
    - Chat-room membership (chat:join) lasts until the client sends
      chat:leave, the connection closes, or the server evicts the user's
      connections from the room because they hid the chat (REST
      DELETE /chats/{chatId} or the delete bulk action).
    - The server sends a protocol-level Ping approximately every 30 seconds
      (never more often, and it may drift later under load) and closes
      connections that do not answer with a Pong within 10 seconds. Standard
      WebSocket clients answer pings automatically; no application code is
      needed.
    - In addition to (not replacing) the protocol-level Ping, the server emits
      a heartbeat message as a normal envelope frame on every one of those
      ticks, to every authenticated connection. Native clients that can observe protocol pings
      may ignore it. Browsers cannot see protocol pings at all — the network
      stack answers them invisibly to JavaScript — so a browser client should
      treat "no frame of any kind (heartbeat or otherwise) for ~90 seconds" as
      a dead connection, force-close it, and reconnect.
    - Presence is connection-scoped: a user becomes online when their first
      connection is established and offline when their last connection closes.
      presence:update is delivered only to users sharing at least one chat
      with the affected user. It is push-only (no on-connect snapshot over the
      socket): after every (re)connect, seed presence from the REST endpoint
      GET /chats/presence, then let live presence:update events win — see the
      snapshot-vs-live race rule in docs/messages/websocket.md.
    - The server does not reconnect for you: clients must implement bounded
      exponential backoff with jitter and re-send chat:join for the chats they
      are viewing after every reconnect.

    ## Close codes

    - 1008 (policy violation, reason "unauthorized") — the token presented at
      the upgrade was missing or invalid. Obtain a fresh token before
      reconnecting.
    - 4401 (application-defined, reason "token expired") — the access token
      that authenticated this connection reached its expiry mid-connection.
      Refresh the token and reconnect.
    - 1009 (message too big) — an inbound frame exceeded 32 KiB.

    ## Rate limiting

    - The HTTP upgrade counts against the same global per-IP limit as the
      REST API (429 with problem+json when exceeded).
    - Inbound frames are limited per connection to 10 events/second with a
      burst of 20. Frames over the limit are dropped; each violation streak
      produces one `error` event with the message "Rate limit exceeded".
    - Independently of the rate limit, inbound frames queue per connection
      (up to the same burst allowance of 20) while earlier frames are still
      being handled. Frames arriving beyond that backlog are dropped, again
      with a single `error` event per drop streak carrying the same
      "Rate limit exceeded" message — one backpressure signal, deliberately
      not a distinct error kind. A streak ends once a frame is accepted
      again.
  contact:
    name: Skipper Club API Team
    email: api@skipperclub.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  development:
    host: localhost:8080
    protocol: ws
    description: Development WebSocket server
    pathname: /v1/ws/chat

  production:
    host: api.skipperclub.app
    protocol: wss
    description: Production WebSocket server (TLS only)
    pathname: /v1/ws/chat

channels:
  notifications:
    address: /v1/ws/chat
    description: Real-time notifications share the authenticated WebSocket connection. Users automatically join their personal room on connection.
    messages:
      notificationNew:
        $ref: "#/components/messages/NotificationNew"

  chat:
    address: /v1/ws/chat
    description: |
      WebSocket channel for chat operations. Users automatically join their personal room
      (user:{userId}) on connection to receive message notifications from all their chats.
    messages:
      chatJoin:
        $ref: "#/components/messages/ChatJoin"
      chatLeave:
        $ref: "#/components/messages/ChatLeave"
      messageSend:
        $ref: "#/components/messages/MessageSend"
      messageRead:
        $ref: "#/components/messages/MessageRead"
      chatTyping:
        $ref: "#/components/messages/ChatTyping"
      messageNew:
        $ref: "#/components/messages/MessageNew"
      messageReceived:
        $ref: "#/components/messages/MessageReceived"
      messageSent:
        $ref: "#/components/messages/MessageSent"
      messageReadReceipt:
        $ref: "#/components/messages/MessageReadReceipt"
      messageReadConfirmed:
        $ref: "#/components/messages/MessageReadConfirmed"
      chatTypingIndicator:
        $ref: "#/components/messages/ChatTypingIndicator"
      chatTypingSent:
        $ref: "#/components/messages/ChatTypingSent"
      presenceUpdate:
        $ref: "#/components/messages/PresenceUpdate"
      chatJoined:
        $ref: "#/components/messages/ChatJoined"
      chatLeft:
        $ref: "#/components/messages/ChatLeft"
      heartbeat:
        $ref: "#/components/messages/Heartbeat"
      error:
        $ref: "#/components/messages/Error"

operations:
  receiveNotification:
    action: receive
    channel:
      $ref: "#/channels/notifications"
    summary: Receive new notifications
    description: |
      Receive real-time notifications when events occur. Users automatically join their personal
      notification room (user:{userId}) upon WebSocket connection. The server emits notification:new
      events to the user's room when notifications are created.
    messages:
      - $ref: "#/channels/notifications/messages/notificationNew"

  joinChat:
    action: send
    channel:
      $ref: "#/channels/chat"
    summary: Join a chat room
    description: Subscribe to real-time updates for a specific chat
    messages:
      - $ref: "#/channels/chat/messages/chatJoin"
    reply:
      channel:
        $ref: "#/channels/chat"
      messages:
        - $ref: "#/channels/chat/messages/chatJoined"
        - $ref: "#/channels/chat/messages/error"

  leaveChat:
    action: send
    channel:
      $ref: "#/channels/chat"
    summary: Leave a chat room
    description: Unsubscribe from real-time updates for a specific chat
    messages:
      - $ref: "#/channels/chat/messages/chatLeave"
    reply:
      channel:
        $ref: "#/channels/chat"
      messages:
        - $ref: "#/channels/chat/messages/chatLeft"
        - $ref: "#/channels/chat/messages/error"

  sendMessage:
    action: send
    channel:
      $ref: "#/channels/chat"
    summary: Send a message to a chat
    description: Send a new message to all participants in a chat room. Returns a message:sent acknowledgement carrying the created message object and broadcasts message:new to all participants.
    messages:
      - $ref: "#/channels/chat/messages/messageSend"
    reply:
      channel:
        $ref: "#/channels/chat"
      messages:
        - $ref: "#/channels/chat/messages/messageSent"
        - $ref: "#/channels/chat/messages/error"

  markMessageRead:
    action: send
    channel:
      $ref: "#/channels/chat"
    summary: Mark message as read
    description: Mark a specific message as read by the current user. Returns message:read:confirmed and broadcasts read receipt to participants.
    messages:
      - $ref: "#/channels/chat/messages/messageRead"
    reply:
      channel:
        $ref: "#/channels/chat"
      messages:
        - $ref: "#/channels/chat/messages/messageReadConfirmed"
        - $ref: "#/channels/chat/messages/error"

  sendTypingIndicator:
    action: send
    channel:
      $ref: "#/channels/chat"
    summary: Send typing indicator
    description: Broadcast typing status to other chat participants. Returns chat:typing:sent confirmation and broadcasts to other participants.
    messages:
      - $ref: "#/channels/chat/messages/chatTyping"
    reply:
      channel:
        $ref: "#/channels/chat"
      messages:
        - $ref: "#/channels/chat/messages/chatTypingSent"
        - $ref: "#/channels/chat/messages/error"

  receiveMessage:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Receive new messages
    description: |
      Receive real-time messages from chat participants. This event is emitted to users
      who are actively in the chat room (have joined via chat:join).
    messages:
      - $ref: "#/channels/chat/messages/messageNew"

  receiveMessageNotification:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Receive message notifications
    description: |
      Receive notifications about new messages from any chat the user participates in.
      This event is automatically emitted to the user's personal room (user:{userId})
      when a message is sent to any chat they're part of, regardless of whether they're
      actively in that chat room. Use this for badge counts and notification bells.
    messages:
      - $ref: "#/channels/chat/messages/messageReceived"

  receiveReadReceipt:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Receive read receipts
    description: Receive notifications when messages are read by other users
    messages:
      - $ref: "#/channels/chat/messages/messageReadReceipt"

  receiveTypingIndicator:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Receive typing indicators
    description: Receive typing status updates from other chat participants
    messages:
      - $ref: "#/channels/chat/messages/chatTypingIndicator"

  receivePresenceUpdate:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Receive presence updates
    description: |
      Receive online/offline status updates for users. Presence is
      connection-scoped: isOnline becomes true when a user's first WebSocket
      connection is established (across all their devices) and false when
      their last connection closes. The update is delivered only to users
      sharing at least one chat with the affected user.
    messages:
      - $ref: "#/channels/chat/messages/presenceUpdate"

  receiveHeartbeat:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Receive server heartbeats
    description: |
      Receive the server's application-level heartbeat. Emitted approximately
      every 30 seconds (never more often) to every authenticated connection,
      piggybacked on the same loop as the protocol-level Ping. It exists so browser clients — which cannot
      observe protocol pings — have an inbound frame to derive liveness from:
      a client that sees no frame of any kind for ~90 seconds should treat the
      connection as dead and reconnect. Native clients with their own ping
      watchdog may ignore it. Clients never send heartbeat.
    messages:
      - $ref: "#/channels/chat/messages/heartbeat"

  receiveError:
    action: receive
    channel:
      $ref: "#/channels/chat"
    summary: Receive error messages
    description: Receive error notifications for failed operations
    messages:
      - $ref: "#/channels/chat/messages/error"

components:
  messages:
    NotificationNew:
      name: notification:new
      title: New Notification
      summary: Real-time notification event sent when a notification is created
      description: |
        Emitted to the user's personal room when a new notification is generated.
        The payload matches the notification object returned by the REST API.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/NotificationPayload"

    ChatJoin:
      name: chat:join
      title: Join Chat
      summary: Request to join a chat room
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatJoinPayload"

    ChatLeave:
      name: chat:leave
      title: Leave Chat
      summary: Request to leave a chat room
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatLeavePayload"

    MessageSend:
      name: message:send
      title: Send Message
      summary: Send a message to a chat
      contentType: application/json
      payload:
        $ref: "#/components/schemas/MessageSendPayload"

    MessageRead:
      name: message:read
      title: Mark Message Read
      summary: Mark a message as read
      contentType: application/json
      payload:
        $ref: "#/components/schemas/MessageReadPayload"

    ChatTyping:
      name: chat:typing
      title: Typing Indicator
      summary: Send typing status to chat participants
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatTypingPayload"

    MessageNew:
      name: message:new
      title: New Message
      summary: Receive a new message in real-time
      description: |
        Emitted to all users in the chat room when a message is sent —
        whether it was created over WS message:send or over REST
        POST /chats/{chatId}/messages. Requires active chat room membership
        (via chat:join).
      contentType: application/json
      payload:
        $ref: "#/components/schemas/MessageNewPayload"

    MessageReceived:
      name: message:received
      title: Message Received Notification
      summary: Receive notification about a new message
      description: |
        Emitted to each participant's personal room (user:{userId}) when a message is sent
        to any chat they're part of — whether it was created over WS message:send or over
        REST POST /chats/{chatId}/messages. This event is sent regardless of whether the
        user is actively in the chat room, but never to the sender's own personal room.
        Use this for badge counts, notification bells, and global message notifications.
        The payload is identical to message:new.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/MessageNewPayload"

    MessageSent:
      name: message:sent
      title: Message Sent
      summary: Acknowledgement carrying the created message object
      description: |
        Sent to the requesting connection after a successful message:send.
        The payload is the created message object — identical in shape to
        message:new — so the sender can reconcile a pending optimistic UI
        entry with the server-assigned id and timestamps. Match it on the
        echoed clientMessageId; per-connection replies are ordered, but order
        alone only identifies the acknowledgement when every send goes out on
        this connection, which stops holding as soon as one falls back to REST.

        For an idempotent replay (a message:send repeating an earlier send's
        clientMessageId), the payload is the previously created message; the
        replay produces no second message:new / message:received fan-out.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/MessageNewPayload"

    MessageReadReceipt:
      name: message:read
      title: Message Read Receipt
      summary: Receive read receipt for a message
      description: |
        Broadcast to the chat room when a participant marks a message read —
        whether over WS message:read, over REST
        PATCH /chats/{chatId}/messages/{messageId} with read=true, or via the
        bulk mark-read action (POST /chats/actions), which emits one receipt
        per chat where at least one message actually transitioned
        unread→read, carrying the newest such message.

        Receipt semantics are cascading: a receipt for message M by user U
        means U has read M and every earlier message in that chat.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/MessageReadReceiptPayload"

    MessageReadConfirmed:
      name: message:read:confirmed
      title: Message Read Confirmed
      summary: Confirmation that message was successfully marked as read
      contentType: application/json
      payload:
        $ref: "#/components/schemas/EmptyPayload"

    ChatTypingIndicator:
      name: chat:typing
      title: Typing Indicator
      summary: Receive typing status from other users
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatTypingIndicatorPayload"

    ChatTypingSent:
      name: chat:typing:sent
      title: Typing Indicator Sent
      summary: Confirmation that typing indicator was successfully sent
      contentType: application/json
      payload:
        $ref: "#/components/schemas/EmptyPayload"

    PresenceUpdate:
      name: presence:update
      title: Presence Update
      summary: Receive user online/offline status updates
      description: |
        Connection-scoped presence: emitted with isOnline=true when a user's
        first connection is established and isOnline=false when their last
        connection closes, delivered only to that user's chat co-participants.
        This event is push-only — it fires on those transitions, not on
        connect. To learn the state of already-online co-participants after a
        (re)connect, seed from the REST snapshot GET /chats/presence and apply
        these live events on top (live always wins; see
        docs/messages/websocket.md).
      contentType: application/json
      payload:
        $ref: "#/components/schemas/PresenceUpdatePayload"

    ChatJoined:
      name: chat:joined
      title: Chat Joined
      summary: Confirmation of successful chat join
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatJoinedPayload"

    ChatLeft:
      name: chat:left
      title: Chat Left
      summary: Confirmation of successful chat leave
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatLeftPayload"

    Heartbeat:
      name: heartbeat
      title: Heartbeat
      summary: Server-initiated application-level keepalive
      description: |
        Emitted approximately every 30 seconds (never more often) to every
        authenticated connection as an ordinary envelope frame, alongside (not
        replacing) the protocol-level Ping. Its purpose is to give browser clients — which cannot observe
        protocol ping/pong — an observable inbound signal for half-open
        detection: derive liveness from any inbound frame and reconnect if none
        arrives for ~90 seconds. Clients never send heartbeat, and a client
        that sends it is ignored like any unknown event.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/HeartbeatPayload"

    Error:
      name: error
      title: Error
      summary: Error message for failed operations
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ErrorPayload"

  schemas:
    HeartbeatPayload:
      type: object
      required:
        - ts
      properties:
        ts:
          type: string
          format: date-time
          description: Server time when the heartbeat was emitted.
          example: "2026-07-17T12:00:00.000Z"

    EmptyPayload:
      type: object
      description: Empty payload for confirmation events
      properties: {}

    ChatJoinPayload:
      type: object
      required:
        - chatId
      properties:
        chatId:
          type: string
          format: uuid
          description: |
            UUID of the chat to join. The WebSocket handler accepts only
            UUID version 7 and rejects any other version with an `error`
            event (the REST API parses generic UUIDs).
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e"

    ChatLeavePayload:
      type: object
      required:
        - chatId
      properties:
        chatId:
          type: string
          format: uuid
          description: |
            UUID of the chat to leave. The WebSocket handler accepts only
            UUID version 7 and rejects any other version with an `error`
            event (the REST API parses generic UUIDs).
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e"

    MessageSendPayload:
      type: object
      required:
        - chatId
        - text
      properties:
        chatId:
          type: string
          format: uuid
          description: |
            UUID of the chat to send message to. The WebSocket handler
            accepts only UUID version 7 and rejects any other version with
            an `error` event (the REST API parses generic UUIDs).
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e"
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: |
            Message content. Length is counted in Unicode characters (runes),
            not bytes: 1 to 1000 characters.
          example: "Hello everyone! 👋"
        clientMessageId:
          type: string
          format: uuid
          description: |
            Optional client-generated idempotency key, unique per (chat,
            sender). Any UUID version is accepted — it is a client
            identifier, not a server entity id, so the UUIDv7 restriction
            applied to chatId deliberately does not apply here. Re-sending
            with the same clientMessageId acknowledges with message:sent
            carrying the already-created message and does not broadcast
            message:new / message:received again. Omit it for non-idempotent
            sends (previous behavior, unchanged).
          example: "6f1e0c2a-9b1d-4a7e-8c3f-2d5b8a91c0de"

    MessageReadPayload:
      type: object
      required:
        - chatId
        - messageId
      properties:
        chatId:
          type: string
          format: uuid
          description: |
            UUID of the chat containing the message. The WebSocket handler
            accepts only UUID version 7 and rejects any other version with
            an `error` event (the REST API parses generic UUIDs).
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e"
        messageId:
          type: string
          format: uuid
          description: |
            UUID of the message to mark as read. The WebSocket handler
            accepts only UUID version 7 and rejects any other version with
            an `error` event (the REST API parses generic UUIDs).
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b30"

    ChatTypingPayload:
      type: object
      required:
        - chatId
        - isTyping
      properties:
        chatId:
          type: string
          format: uuid
          description: |
            UUID of the chat where user is typing. The WebSocket handler
            accepts only UUID version 7 and rejects any other version with
            an `error` event (the REST API parses generic UUIDs).
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e"
        isTyping:
          type: boolean
          description: Whether user is currently typing
          example: true

    MessageNewPayload:
      type: object
      required:
        - id
        - chatId
        - text
        - read
        - createdAt
        - updatedAt
        - user
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the message
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b30"
        chatId:
          type: string
          format: uuid
          description: UUID of the chat
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e"
        text:
          type: string
          description: Message content
          example: "Hello everyone! 👋"
        read:
          type: boolean
          description: |
            Always false in message:new and message:received events: the
            server builds one message snapshot when the message is created and
            sends the identical bytes to every recipient, so this flag cannot
            carry per-recipient read state. Per-viewer read state is only
            available from the REST message responses. Clients should derive
            read/unread state from their own read receipts, not from this field.
          example: false
        clientMessageId:
          type: string
          format: uuid
          description: |
            The idempotency key the sender supplied on `message:send` (or the
            REST create), echoed back. Present only when the send carried one,
            and only meaningful to the client that sent it: use it to match
            this message against a pending optimistic entry, including across
            that user's other connections, where the ordered-reply guarantee
            below does not apply. Any UUID version.
          example: "9f1c2b7a-3d4e-4f5a-8b6c-7d8e9f0a1b2c"
        createdAt:
          type: string
          format: date-time
          description: Message creation timestamp
          example: "2025-01-29T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Message last updated timestamp
          example: "2025-01-29T12:00:00.000Z"
        user:
          $ref: "#/components/schemas/MessageUser"

    MessageUser:
      type: object
      required:
        - id
        - name
        - avatarUrl
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the user who sent the message
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b99"
        name:
          type: string
          description: Name of the user who sent the message
          example: "Jan Kowalski"
        avatarUrl:
          type:
            - string
            - "null"
          format: uri
          description: Full URL to the user's avatar image
          example: "https://cdn.skipperclub.com/avatars/user-123.jpg"

    MessageReadReceiptPayload:
      type: object
      required:
        - messageId
        - userId
        - readAt
      properties:
        messageId:
          type: string
          format: uuid
          description: UUID of the message that was read
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b30"
        userId:
          type: string
          format: uuid
          description: UUID of the user who read the message
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b99"
        readAt:
          type: string
          format: date-time
          description: Timestamp when message was read
          example: "2025-01-29T12:01:00.000Z"

    ChatTypingIndicatorPayload:
      type: object
      required:
        - userId
        - chatId
        - isTyping
      properties:
        userId:
          type: string
          format: uuid
          description: UUID of the user who is typing
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b99"
        chatId:
          type: string
          format: uuid
          description: UUID of the chat where user is typing
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e"
        isTyping:
          type: boolean
          description: Whether user is currently typing
          example: true

    PresenceUpdatePayload:
      type: object
      required:
        - userId
        - isOnline
        - lastSeen
      properties:
        userId:
          type: string
          format: uuid
          description: UUID of the user whose presence changed
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b99"
        isOnline:
          type: boolean
          description: Whether user is currently online
          example: true
        lastSeen:
          type: string
          format: date-time
          description: Last seen timestamp (current time if online)
          example: "2025-01-29T12:00:00.000Z"

    ChatJoinedPayload:
      type: object
      required:
        - chatId
      properties:
        chatId:
          type: string
          format: uuid
          description: UUID of the chat that was joined
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e"

    ChatLeftPayload:
      type: object
      required:
        - chatId
      properties:
        chatId:
          type: string
          format: uuid
          description: UUID of the chat that was left
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e"

    ErrorPayload:
      type: object
      required:
        - type
        - message
        - timestamp
      properties:
        type:
          type: string
          description: Error type identifier
          example: "websocket_error"
        message:
          type: string
          description: Human-readable error message
          example: "Chat not found"
        timestamp:
          type: string
          format: date-time
          description: Error occurrence timestamp
          example: "2025-01-29T12:00:00.000Z"

    ChatType:
      type: string
      enum:
        - ONE_TO_ONE
        - GROUP
        - CRUISE_QNA
        - CRUISE_GROUP
      description: |
        Type of chat:
        - ONE_TO_ONE: Private chat between two users
        - GROUP: Group chat between multiple users
        - CRUISE_QNA: Cruise Q&A chat (participants ask organizer)
        - CRUISE_GROUP: Cruise group chat (all participants)

    NotificationPayload:
      type: object
      description: Notification object matching the REST API response format
      required:
        - id
        - recipientId
        - eventType
        - sourceType
        - sourceId
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Notification UUID v7
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b99"
        recipientId:
          type: string
          format: uuid
          description: Recipient user ID
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b00"
        eventType:
          type: string
          enum:
            - CRUISE_INVITATION_SENT
            - CRUISE_PARTICIPANT_JOINED
            - CRUISE_REQUEST_PENDING
            - CRUISE_REQUEST_ACCEPTED
            - CRUISE_REQUEST_REJECTED
            - CRUISE_INVITATION_ACCEPTED
            - CRUISE_PARTICIPANT_LEFT
            - CRUISE_PARTICIPANT_REMOVED
            - CRUISE_DETAILS_CHANGED
            - POST_REACTED
            - POST_COMMENTED
            - FRIEND_REQUEST_SENT
            - FRIEND_REQUEST_ACCEPTED
            - FRIEND_REQUEST_REJECTED
            - REVIEW_PENDING_RECEIVED
            - REVIEW_PUBLISHED
            - CRUISE_REVIEW_REMINDER
          description: Domain event that triggered the notification
        sourceType:
          type: string
          enum:
            - CRUISE
            - POST
            - MESSAGE
            - REVIEW
            - MEDIA
            - FRIEND
          description: Source domain object for the notification
        sourceId:
          type: string
          format: uuid
          description: Source object identifier (e.g., cruise ID, post ID)
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b98"
        relationId:
          type:
            - string
            - "null"
          format: uuid
          description: Optional related entity ID (e.g., actor user ID)
          example: "018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b97"
        status:
          type: string
          enum:
            - UNREAD
            - READ
          description: Notification read state
        metadata:
          type:
            - object
            - "null"
          additionalProperties: true
          description: Context data for rendering the notification
          example:
            cruiseTitle: "Mediterranean Adventure"
            actorName: "John Smith"
        createdAt:
          type: string
          format: date-time
          description: Notification creation timestamp
          example: "2025-01-29T12:00:00.000Z"
        readAt:
          type:
            - string
            - "null"
          format: date-time
          description: Timestamp when notification was marked as read
          example: null

  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived JWT access token (the same one the REST API uses) for
        WebSocket authentication. Can be provided via:
        - HTTP upgrade header: Authorization: Bearer <jwt-token> — preferred
          for native clients that can set upgrade headers.
        - Query parameter: ?token=<jwt-token> — for browser WebSocket clients,
          which cannot set arbitrary upgrade headers. The server logs the
          request path only, and redacts the parameter (token=[Filtered])
          from error reports before they leave the process; clients should
          still never log URLs carrying it.

        A missing or invalid token closes the connection with 1008
        ("unauthorized"). When the access token expires while the connection
        is open, the server closes it with 4401 ("token expired"); refresh
        the token and reconnect.
