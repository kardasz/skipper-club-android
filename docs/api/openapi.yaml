  /spot-change-requests:
    post:
      operationId: createSpotChangeRequest
      tags:
        - spots
      summary: Propose a spot change
      description: >
        Any authenticated user may propose a spot change. The change request stays `pending` until
        an admin approves or rejects it.

        Delete-type requests (`SPOT_DELETE_REQUEST`, `PHONE_CONTACT_DELETE_REQUEST`,
        `RADIO_CHANNEL_DELETE_REQUEST`) require a `comment`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpotChangeRequestRequest'
      responses:
