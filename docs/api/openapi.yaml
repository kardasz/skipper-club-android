openapi: 3.1.0
info:
  title: SkipperClub API
  description: API for the SkipperClub social platform – connecting skippers and sailing enthusiasts.
  version: 1.0.0
  contact:
    name: SkipperClub Team
    email: contact@skipperclub.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.skipperclub.app/v1
    description: Staging server

tags:
  - name: audio
    description: Audio processing and transcription
  - name: auth
    description: Authentication and authorization
  - name: invitations
    description: User invitations system
  - name: check-ins
    description: User location presence (latest check-in per user)
  - name: spots
    description: Community-driven spots directory with admin approval workflow
  - name: cruises
    description: Sailing cruises
  - name: friends
    description: Friend system
  - name: geocoder
    description: Location geocoding and reverse geocoding
  - name: messages
    description: Messaging and chats
  - name: notifications
    description: Notification center
  - name: posts
    description: Social feed and posts
  - name: push
    description: Push notification token management
  - name: regions
    description: Sailing regions
  - name: sailing-brief
    description: Region-based sailing briefs with AI-generated content
  - name: uploads
    description: Media uploads
  - name: users
    description: User profiles and management
  - name: webhooks
    description: Incoming webhooks from external services

security:
  - bearerAuth: []

paths:
  /audio/transcription:
    post:
      operationId: transcribeAudio
      tags: [audio]
      summary: Transcribe audio to text
      description: |
        Transcribes an audio file to text using OpenAI Whisper model.
        Supports multiple audio formats (audio/webm, audio/mpeg, audio/mp3, audio/mp4, audio/wav, audio/ogg) with a maximum file size of 20MB.
        The language for transcription is determined from the Accept-Language header.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: >-
                    Audio file (max 20MB). Supported formats: audio/webm, audio/mpeg,
                    audio/mp3, audio/mp4, audio/wav, audio/ogg
      responses:
        '200':
          description: Audio transcribed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
        '400':
          description: Bad request - no file provided or invalid file
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AudioProblem'
              examples:
                noAudioProvided:
                  value:
                    type: '/errors/no-audio-provided'
                    title: 'No Audio Provided'
                    status: 400
                    detail: 'An audio file must be provided for transcription'
                unsupportedAudioFormat:
                  value:
                    type: '/errors/unsupported-audio-format'
                    title: 'Unsupported Audio Format'
                    status: 400
                    detail: 'The audio file format is not supported. Please use audio/webm format.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File too large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AudioProblem'
              examples:
                audioFileTooLarge:
                  value:
                    type: '/errors/audio-file-too-large'
                    title: 'Audio File Too Large'
                    status: 413
                    detail: 'The audio file exceeds the maximum size of 20MB'
        '502':
          description: Transcription service error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AudioProblem'
              examples:
                transcriptionFailed:
                  value:
                    type: '/errors/transcription-failed'
                    title: 'Transcription Failed'
                    status: 502
                    detail: 'The transcription service failed to process the audio'

  /friend-requests:
    get:
      operationId: listFriendRequests
      tags: [friends]
      summary: Get friend requests
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
          description: Filter requests created from this date (inclusive)
          example: '2025-01-01'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of requests to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 10000
          description: Number of requests to skip
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FriendRequestState'
          description: Filter requests by state
        - name: toDate
          in: query
          schema:
            type: string
            format: date
          description: Filter requests created until this date (inclusive)
          example: '2025-12-31'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/SortFriendRequests'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: List of friend requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestsList'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createFriendRequest
      tags: [friends]
      summary: Send a friend request
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
                  description: UUID v7 identifier of the user to send request to
                  example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
      responses:
        '201':
          description: Friend request sent
          headers:
            Location:
              description: URI of the created friend request
              schema:
                type: string
                format: uri
                example: 'https://api.skipperclub.app/v1/friend-requests/01234567-89ab-cdef-0123-456789abcdef'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Target user not found
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FriendsProblem'
              examples:
                targetUserNotFound:
                  value:
                    type: '/errors/target-user-not-found'
                    title: 'Target User Not Found'
                    status: 404
                    detail: 'The target user could not be found'
        '422':
          description: Validation or business logic error
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                type: object
                required: [type, title, status, detail]
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  violations:
                    type: array
                    items:
                      type: object
              examples:
                validationError:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'userId'
                        message: 'userId is required'
                cannotFriendYourself:
                  value:
                    type: '/errors/cannot-friend-yourself'
                    title: 'Cannot Friend Yourself'
                    status: 422
                    detail: 'You cannot send a friend request to yourself'
                usersAlreadyFriends:
                  value:
                    type: '/errors/users-already-friends'
                    title: 'Users Already Friends'
                    status: 422
                    detail: 'These users are already friends'
                friendRequestAlreadyExists:
                  value:
                    type: '/errors/friend-request-already-exists'
                    title: 'Friend Request Already Exists'
                    status: 422
                    detail: 'A friend request already exists between these users'

  /friend-requests/{id}:
    delete:
      operationId: deleteFriendRequest
      tags: [friends]
      summary: Cancel friend request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Request canceled
        '403':
          description: Access denied
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FriendsProblem'
              examples:
                friendRequestAccessForbidden:
                  value:
                    type: '/errors/friend-request-access-forbidden'
                    title: 'Friend Request Access Forbidden'
                    status: 403
                    detail: 'You are not allowed to access this friend request'
        '404':
          description: Friend request not found
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FriendsProblem'
              examples:
                friendRequestNotFound:
                  value:
                    type: '/errors/friend-request-not-found'
                    title: 'Friend Request Not Found'
                    status: 404
                    detail: 'The requested friend request could not be found'
        '422':
          description: Invalid friend request state
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FriendsProblem'
              examples:
                invalidFriendRequestState:
                  value:
                    type: '/errors/invalid-friend-request-state'
                    title: 'Invalid Friend Request State'
                    status: 422
                    detail: 'The friend request cannot be modified in its current state'

    patch:
      operationId: updateFriendRequestState
      tags: [friends]
      summary: Update friend request state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestStateUpdate'
      responses:
        '200':
          description: Request state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Access denied
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FriendsProblem'
              examples:
                friendRequestAccessForbidden:
                  value:
                    type: '/errors/friend-request-access-forbidden'
                    title: 'Friend Request Access Forbidden'
                    status: 403
                    detail: 'You are not allowed to access this friend request'
        '404':
          description: Friend request not found
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FriendsProblem'
              examples:
                friendRequestNotFound:
                  value:
                    type: '/errors/friend-request-not-found'
                    title: 'Friend Request Not Found'
                    status: 404
                    detail: 'The requested friend request could not be found'
        '422':
          description: Validation or business logic error
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                type: object
                required: [type, title, status, detail]
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  violations:
                    type: array
                    items:
                      type: object
              examples:
                validationError:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'state'
                        message: 'state is required'
                invalidFriendRequestState:
                  value:
                    type: '/errors/invalid-friend-request-state'
                    title: 'Invalid Friend Request State'
                    status: 422
                    detail: 'The friend request cannot be modified in its current state'

  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: Get friends list
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of friends to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of friends to skip
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search phrase to filter friends by name
          example: 'jan'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/SortFriends'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: List of friends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendsList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /friends/{friendId}:
    delete:
      operationId: deleteFriend
      tags: [friends]
      summary: Remove friend
      parameters:
        - name: friendId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Friend removed
        '404':
          description: Friendship not found
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FriendsProblem'
              examples:
                friendshipNotFound:
                  value:
                    type: '/errors/friendship-not-found'
                    title: 'Friendship Not Found'
                    status: 404
                    detail: 'The requested friendship could not be found'

  /geocoder/search:
    get:
      operationId: searchLocations
      tags: [geocoder]
      summary: Search locations by name or address
      description: |
        Search for places and locations using Google Maps Places API Text Search.
        Returns up to 20 matching locations with coordinates, address details, and place information.
        Results are localized based on Accept-Language header.
        Rate limited to 30 requests per minute.
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: Address or place name to search for (supports single-letter city names like "Å" in Norway)
          example: 'Split, Croatia'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 20
          description: Maximum number of results to return
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Location search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocoderSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: Geocoding service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GeocoderProblem'

  /geocoder/reverse:
    get:
      operationId: reverseGeocode
      tags: [geocoder]
      summary: Convert coordinates to location addresses
      description: |
        Convert geographic coordinates (latitude/longitude) to human-readable addresses
        using Google Maps Reverse Geocoding API.
        Returns up to 20 matching addresses with varying levels of detail.
        Results are localized based on Accept-Language header.
        Rate limited to 30 requests per minute.
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          description: Latitude in WGS84 format (-90 to 90)
          example: 43.5081
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          description: Longitude in WGS84 format (-180 to 180)
          example: 16.4402
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 20
          description: Maximum number of results to return
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Reverse geocoding results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocoderSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: Geocoding service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GeocoderProblem'

  /geocoder/autocomplete:
    get:
      operationId: autocomplete
      tags: [geocoder]
      summary: Get place autocomplete suggestions
      description: |
        Returns autocomplete predictions for place searches using Google Maps Places Autocomplete API.
        Returns up to 5 matching predictions with place IDs and structured formatting.
        Results are localized based on Accept-Language header.
        Rate limited to 30 requests per minute.

        **Session Tokens**: Use the same sessionToken for autocomplete and subsequent place-details
        requests to group them into a single billing session. This optimizes costs as multiple
        autocomplete requests followed by a place details request are billed as a single request.
      security:
        - bearerAuth: []
      parameters:
        - name: input
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: The text input specifying which place to search for
          example: 'Marina Split'
        - name: sessionToken
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: |
            A random string identifying an autocomplete session for billing purposes.
            Use the same token for autocomplete and the subsequent place-details request.
          example: 'abc123-session-token'
        - name: types
          in: query
          required: false
          schema:
            type: string
            enum:
              ['geocode', 'address', 'establishment', '(regions)', '(cities)']
          description: |
            Type of place results to return:
            - geocode: Only geocoding results
            - address: Results with precise addresses
            - establishment: Business results
            - (regions): Regions (locality, sublocality, postal_code, country, admin areas)
            - (cities): Cities (locality or administrative_area_level_3)
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Autocomplete predictions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutocompleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: Geocoding service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GeocoderProblem'

  /geocoder/places/{placeId}:
    get:
      operationId: getPlaceDetails
      tags: [geocoder]
      summary: Get detailed information about a place
      description: |
        Returns detailed information about a place using Google Maps Place Details API.
        Use the placeId from autocomplete or search results.
        Results are localized based on Accept-Language header.
        Rate limited to 30 requests per minute.

        **Session Tokens**: Use the same sessionToken from the preceding autocomplete request
        to group requests into a single billing session.
      security:
        - bearerAuth: []
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: string
          description: A textual identifier that uniquely identifies a place
          example: 'ChIJN1t_tDeuEmsRUsoyG83frY4'
        - name: sessionToken
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: |
            The session token from the preceding autocomplete request.
            Using the same token groups the requests for billing optimization.
          example: 'abc123-session-token'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Place details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceDetailsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Place not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GeocoderProblem'
              examples:
                placeNotFound:
                  value:
                    type: '/errors/place-not-found'
                    title: 'Place Not Found'
                    status: 404
                    detail: 'The place with ID "invalid-id" could not be found.'
        '503':
          description: Geocoding service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GeocoderProblem'

  /health:
    get:
      operationId: getHealth
      tags: []
      summary: Health check
      description: Returns 200 if the API is running.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: API is healthy
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                type: object
                required: [type, title, status, detail]
                properties:
                  type:
                    type: string
                    example: '/errors/bad-request'
                  title:
                    type: string
                    example: 'Bad Request'
                  status:
                    type: integer
                    example: 400
                  detail:
                    type: string
                    example: 'The request is malformed'
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema:
                type: object
                required: [type, title, status, detail]
                properties:
                  type:
                    type: string
                    example: '/errors/service-unavailable'
                  title:
                    type: string
                    example: 'Service Unavailable'
                  status:
                    type: integer
                    example: 503
                  detail:
                    type: string
                    example: 'The service is temporarily unavailable'

  /media:
    post:
      operationId: uploadMedia
      tags: [uploads]
      summary: Upload image or video
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image or video file
                type:
                  type: string
                  enum: [image, video]
                  default: image
      responses:
        '201':
          description: Media uploaded
          headers:
            Location:
              description: URI of the uploaded media
              schema:
                type: string
                format: uri
                example: 'https://api.skipperclub.app/v1/media/01234567-89ab-cdef-0123-456789abcdef'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          description: Bad request - no file provided
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MediaProblem'
              examples:
                noFileProvided:
                  value:
                    type: '/errors/no-file-provided'
                    title: 'No File Provided'
                    status: 400
                    detail: 'A file must be provided for media upload'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MediaProblem'
              examples:
                unsupportedMediaType:
                  value:
                    type: '/errors/unsupported-media-type'
                    title: 'Unsupported Media Type'
                    status: 422
                    detail: 'The uploaded file type is not supported'

  /media/presigned-url:
    post:
      operationId: generatePresignedUrl
      tags: [uploads]
      summary: Generate presigned URL for media upload
      description: Generate a presigned URL for uploading media files. Supports images (JPEG, PNG, HEIC) up to 10MB and videos (MP4) up to 50MB.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreSignedUrlRequest'
      responses:
        '201':
          description: Presigned URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreSignedUrlResponse'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                invalidFileType:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'fileType'
                        message: 'fileType must be one of the following types: image/jpeg, image/png, image/heic, video/mp4'
                fileSizeExceeded:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'fileSize'
                        message: 'File size exceeds maximum allowed size of 10MB for image files'
                videoSizeExceeded:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'fileSize'
                        message: 'File size exceeds maximum allowed size of 50MB for video files'
                missingFields:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'fileName'
                        message: 'fileName is required'
                      - propertyPath: 'fileType'
                        message: 'fileType must be one of the following types: image/jpeg, image/png, image/heic, video/mp4'
                      - propertyPath: 'fileSize'
                        message: 'fileSize must be at least 1'
                invalidFileSize:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'fileSize'
                        message: 'fileSize must be at least 1'

  /media/{id}/confirm-upload:
    post:
      operationId: confirmUpload
      tags: [uploads]
      summary: Confirm media upload
      description: Confirms that a media file has been successfully uploaded via presigned URL and changes status from PENDING to VALIDATED
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID v7 identifier for the media file
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Media upload confirmed successfully
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MediaProblem'
              examples:
                incorrectStatus:
                  value:
                    type: '/errors/media-incorrect-status'
                    title: 'Media Incorrect Status'
                    status: 400
                    detail: 'Media must have PENDING status to be confirmed, current status is validated'
        '404':
          description: Media not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MediaProblem'
              examples:
                mediaNotFound:
                  value:
                    type: '/errors/media-not-found'
                    title: 'Media Not Found'
                    status: 404
                    detail: 'The requested media could not be found'

  /webhooks/email/sendgrid:
    post:
      operationId: handleSendGridWebhook
      tags: [webhooks]
      summary: Handle SendGrid email events
      description: |
        Endpoint for receiving webhook events from SendGrid (delivery, bounce, open, click, etc.).
        Protected by signature verification.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  email:
                    type: string
                  timestamp:
                    type: integer
                  event:
                    type: string
                  sg_message_id:
                    type: string
      responses:
        '200':
          description: Events processed
        '401':
          description: Invalid signature

  /webhooks/email/mailgun:
    post:
      operationId: handleMailgunWebhook
      tags: [webhooks]
      summary: Handle Mailgun email events
      description: |
        Endpoint for receiving webhook events from Mailgun (delivered, opened, clicked, failed, etc.).
        Protected by HMAC-SHA256 signature verification.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailgunWebhookPayload'
      responses:
        '200':
          description: Event processed
        '401':
          description: Invalid signature

  /webhooks/email/aws-ses:
    post:
      operationId: handleAwsSesWebhook
      tags: [webhooks]
      summary: AWS SES/SNS webhook endpoint for email tracking events
      description: |
        Receives webhook events from AWS SNS for SES email delivery tracking.
        Handles three SNS message types:
        - SubscriptionConfirmation: Confirms endpoint subscription
        - UnsubscribeConfirmation: Acknowledges unsubscription
        - Notification: Processes SES delivery events (Delivery, Bounce, Complaint)

        Signature verification is performed using the sns-validator library.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwsSnsMessage'
      responses:
        '200':
          description: Event processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      [
                        processed,
                        subscription_confirmed,
                        unsubscribe_acknowledged,
                      ]
        '401':
          description: Invalid or missing SNS signature
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthProblem'

  /chats:
    get:
      operationId: listChats
      tags: [messages]
      summary: Get chat list
      description: Returns all chats for the current user (1:1, group, cruise-related)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of chats to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of chats to skip
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search phrase to filter chats by name or participant names
          example: 'jan'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChatType'
          description: Filter chats by type
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/SortChats'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: List of chats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatsList'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createChat
      tags: [messages]
      summary: Create new chat
      description: Creates a new 1:1 or group chat. Friendship between participants is not required. Returns existing chat if 1:1 chat already exists.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreate'
      responses:
        '201':
          description: Chat created or existing chat returned
          headers:
            Location:
              description: URI of the chat
              schema:
                type: string
                format: uri
                example: 'https://api.skipperclub.app/v1/chats/01234567-89ab-cdef-0123-456789abcdef'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: The request was well-formed but contains semantic errors
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                missingParticipantIds:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'participantIds'
                        message: 'participantIds is required'
                emptyParticipantIds:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'participantIds'
                        message: 'participantIds must contain at least 1 participant'
                tooManyParticipants:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'participantIds'
                        message: 'participantIds cannot contain more than 50 participants'
                invalidUuidFormat:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'participantIds[0]'
                        message: 'must be a valid UUID'
                duplicateParticipants:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'participantIds'
                        message: 'participantIds must contain unique values'
                missingGroupName:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'name'
                        message: 'name is required for group chats with 3 or more participants'
                nameTooLong:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'name'
                        message: 'name cannot be longer than 100 characters'

