          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listSpotChangeRequests
      tags: [spots]
      summary: List spot change requests
      description: |
        - Regular users only see their own requests.
        - Admins see all pending requests by default; use `scope=mine` to filter to own, or `status` to see other states.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SpotChangeRequestStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/SpotChangeRequestType'
        - name: requestedByUserId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by requesting user (admin only)
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, all]
          description: Admin-only scope override (default all)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Paginated list of change requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotChangeRequestsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: batchTransitionSpotChangeRequests
      tags: [spots]
      summary: Batch approve, reject, or cancel change requests
      description: |
        Processes each ID independently in its own transaction. Always returns `200 OK`; per-item errors are embedded in `data[].error`.

        - `approve` / `reject`: admin only
        - `cancel`: the requesting user may cancel their own pending request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTransitionChangeRequestsRequest'
      responses:
        '200':
          description: Batch result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTransitionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Non-admin user tried to approve/reject
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /check-ins:
    put:
      operationId: upsertCheckIn
      tags: [check-ins]
      summary: Create or replace the current user's check-in
      description: |
        Stores exactly one latest check-in per user. Each call replaces the previous location.
        `checkedInAt` is set by the server at write time.

        When `locationName` is omitted, the API attempts reverse geocoding (see `Accept-Language`).
        If geocoding is unavailable, coordinates are still saved and `locationName` may be null.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInUpsertRequest'
      responses:
        '200':
          description: Current check-in after upsert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listCheckIns
      tags: [check-ins]
      summary: List nearby active check-ins
      description: |
        Returns active check-ins within `distance` of the search center, sorted by distance ascending.
        Only non-stale check-ins are returned (default freshness window 24 hours, configurable via `CHECK_IN_FRESHNESS_TTL_HOURS`).
        The current user is included when their check-in falls within the radius.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
          description: Search center latitude (WGS84)
        - name: lng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
          description: Search center longitude (WGS84)
        - name: distance
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
          description: Search radius in kilometers (converted to meters for PostGIS)
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Page size
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Pagination offset
      responses:
        '200':
          description: Paginated list of check-ins with distance from search center
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /cruises:
    get:
      operationId: listCruises
      tags: [cruises]
      summary: Get list of cruises
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
          description: Filter cruises departing from this date (inclusive)
          example: '2025-01-01'
        - name: hashtag
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 50
            pattern: '^[a-zA-Z0-9_]+$'
          description: Filter cruises by hashtag (without # symbol)
          example: 'sailing'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of cruises to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of cruises to skip
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search phrase to filter cruises by title, description, or location
          example: 'baltic'
        - name: toDate
          in: query
          schema:
            type: string
            format: date
          description: Filter cruises departing until this date (inclusive)
          example: '2025-12-31'
        - name: vesselBrand
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 100
          description: Filter cruises by vessel brand
          example: 'Beneteau'
        - name: vesselCabins
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
          description: Filter by number of cabins
          example: 4
        - name: vesselLengthMax
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 15
            maximum: 200
          description: Maximum vessel length in feet
          example: 60
        - name: vesselLengthMin
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 15
            maximum: 200
          description: Minimum vessel length in feet
          example: 40
        - name: vesselModel
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 100
          description: Filter cruises by vessel model
          example: 'Oceanis'
        - name: vesselType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VesselType'
          description: Filter cruises by vessel type
          example: 'SAILING_YACHT'
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [all, mine, organized, participating]
            default: all
          description: |
            Filter cruises by scope:
            - `all`: Public cruises only (default)
            - `mine`: All cruises where user is organizer or participant
            - `organized`: Cruises organized by the user
            - `participating`: Cruises where user is a participant
          example: 'all'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CruiseParticipantState'
          description: Filter by participation state (only applicable with scope=mine or scope=participating)
        - name: regionCode
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
          description: Filter cruises by region code (includes all descendants)
          example: 'MED'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CruiseType'
          description: Filter cruises by type
          example: 'FAMILY'
        - name: smokingAllowed
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by smoking policy (true = smoking allowed, false = smoking forbidden)
          example: false
        - name: alcoholAllowed
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by alcohol policy (true = alcohol allowed, false = alcohol forbidden)
          example: true
        - name: petsAllowed
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by pets policy (true = pets allowed, false = pets forbidden)
          example: false
        - name: childrenAllowed
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by children policy (true = children allowed, false = children forbidden)
          example: true
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/SortCruises'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: List of cruises
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CruisesList'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createCruise
