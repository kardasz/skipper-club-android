      responses:
        '201':
          description: Created cruise
          headers:
            Location:
              description: URI of the created cruise
              schema:
                type: string
                format: uri
                example: 'https://api.skipperclub.app/v1/cruises/01234567-89ab-cdef-0123-456789abcdef'
          content:
            application/json:
