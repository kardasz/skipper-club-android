          description: Communication skills rating
          example: 5
        behavior:
          type: integer
          minimum: 1
          maximum: 5
          description: Behavior and attitude rating
          example: 4
        skills:
          type: integer
          minimum: 1
          maximum: 5
          description: Sailing skills rating
          example: 5
        duties:
          type: integer
          minimum: 1
          maximum: 5
          description: Task completion and duties rating
          example: 4
        average:
          type: number
          format: float
          minimum: 1
          maximum: 5
          description: Average of all ratings
          example: 4.5

    ReviewCreate:
      type: object
      required:
        [reviewedUserId, communication, behavior, skills, duties, comment]
      properties:
        reviewedUserId:
          type: string
          format: uuid
          description: UUID of the user being reviewed (must be cruise participant)
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        communication:
          type: integer
          minimum: 1
          maximum: 5
          description: Communication skills rating (1-5)
          example: 5
        behavior:
          type: integer
          minimum: 1
          maximum: 5
          description: Behavior and attitude rating (1-5)
          example: 4
        skills:
          type: integer
          minimum: 1
          maximum: 5
          description: Sailing skills rating (1-5)
          example: 5
        duties:
          type: integer
          minimum: 1
          maximum: 5
          description: Task completion and duties rating (1-5)
          example: 4
        comment:
          type: string
          minLength: 100
          maxLength: 1000
          description: Detailed review comment (minimum 100 characters)
          example: 'Great crew member! Very helpful with navigation and always willing to take on tasks. Good communication throughout the trip. Would definitely sail together again.'

    ReviewsList:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        total:
          type: integer
          description: Total number of published reviews for the cruise
          example: 8
        limit:
          type: integer
          example: 20
