          description: Related cruise ID for cruise-related chats
          example: 018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e
        unreadCount:
          type: integer
          description: Number of unread messages for current user
          example: 3
        updatedAt:
          type: string
