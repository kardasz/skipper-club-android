        cruiseId:
          type: string
          format: uuid
          description: Cruise UUID v7 identifier
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        reviewer:
          $ref: '#/components/schemas/User'
        reviewedUser:
          $ref: '#/components/schemas/User'
        cruise:
