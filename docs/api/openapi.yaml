            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                missingDescription:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'description'
                        message: 'description should not be empty'
                emptyDescriptionMessage:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'description'
                        message: 'description must be longer than or equal to 1 characters'
                descriptionTooLong:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'description'
                        message: 'description must be shorter than or equal to 2200 characters'
                missingMediaIds:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'mediaIds'
                        message: 'mediaIds should not be empty'
                emptyMediaIds:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'mediaIds'
                        message: 'mediaIds must contain at least 1 elements'
                tooManyMediaIds:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'mediaIds'
                        message: 'mediaIds must contain no more than 10 elements'
                invalidMediaIdFormat:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'mediaIds.0'
                        message: 'each value in mediaIds must be a UUID'
                locationTooLong:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'location'
                        message: 'location must be shorter than or equal to 255 characters'
                tooManyTaggedUsers:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'taggedUserIds'
