            - type: 'null'
        reviewedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        rejectionReason:
          type:
            - string
            - 'null'
        cancelledAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SpotChangeRequestsListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SpotChangeRequestResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    BatchTransitionChangeRequestsRequest:
      type: object
      required:
        - ids
        - action
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        action:
          type: string
          enum:
            - approve
            - reject
            - cancel
        rejectionReason:
          type: string
          maxLength: 1000
          description: Required when action is reject
    BatchTransitionResultItemSuccess:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SpotChangeRequestStatus'
        appliedResource:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
              format: uuid
    BatchTransitionResultItemError:
      type: object
      required:
        - id
        - error
      properties:
        id:
          type: string
          format: uuid
        error:
          $ref: '#/components/schemas/ApiProblem'
    BatchTransitionResult:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/BatchTransitionResultItemSuccess'
              - $ref: '#/components/schemas/BatchTransitionResultItemError'
        meta:
          type: object
          required:
            - requested
            - succeeded
            - failed
          properties:
            requested:
              type: integer
            succeeded:
              type: integer
            failed:
              type: integer
    ApiProblem:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type
        title:
          type: string
          description: A short, human-readable summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
    NearbySpotItem:
      type: object
      required:
        - id
        - name
        - coordinates
        - distanceMeters
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        coordinates:
          type: object
          required:
            - lat
            - lng
          properties:
            lat:
              type: number
              format: double
            lng:
              type: number
              format: double
        distanceMeters:
          type: integer
          description: Distance in meters from the proposed spot location
    SpotDuplicateProblem:
      allOf:
        - $ref: '#/components/schemas/ApiProblem'
        - type: object
          properties:
            nearbySpots:
              type: array
              description: Existing spots that triggered the duplicate check
              items:
                $ref: '#/components/schemas/NearbySpotItem'
    PostPermissions:
      type: object
      required:
        - edit
        - delete
        - archive
        - resolve
        - comment
        - react
        - bookmark
        - report
        - validityVote
      properties:
        edit:
          type: boolean
        delete:
          type: boolean
        archive:
          type: boolean
        resolve:
          type: boolean
        comment:
          type: boolean
        react:
          type: boolean
        bookmark:
          type: boolean
        report:
          type: boolean
        validityVote:
          type: boolean
    Coordinates:
      type: object
      description: Geographic coordinates (WGS84)
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude (-90 to 90)
          example: 43.5081
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude (-180 to 180)
          example: 16.4402
    AddressComponent:
      type: object
      description: A component of an address (city, country, etc.)
      properties:
        longName:
          type: string
          description: Full name of the component
          example: Split
        shortName:
          type: string
          description: Abbreviated name of the component
          example: Split
        types:
          type: array
          items:
            type: string
          description: Type classifications for this component
          example:
            - locality
            - political
    GeocoderLocation:
      type: object
      description: A geocoded location or place result
      required:
        - formattedAddress
        - coordinates
      properties:
        formattedAddress:
          type: string
          description: Full formatted address string
          example: Split, Croatia
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        placeId:
          type: string
          description: Google Place ID for further lookups
          example: ChIJLYsKc_FPahQRq0aE88E8eUE
        types:
          type: array
          items:
            type: string
          description: Address type classifications from Google
          example:
            - locality
            - political
        addressComponents:
          type: array
          items:
            $ref: '#/components/schemas/AddressComponent'
          description: Detailed breakdown of the address
        name:
          type: string
          description: Place or business name (only for search results, not reverse geocoding)
          example: ACI Marina Split
        rating:
          type: number
          format: double
          minimum: 1
          maximum: 5
          description: Place rating from 1.0 to 5.0 (only for places with ratings)
          example: 4.5
        userRatingsTotal:
          type: integer
          description: Total number of user ratings for this place
          example: 1250
    GeocoderSearchResponse:
      type: object
      description: Response containing geocoding results
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GeocoderLocation'
          description: List of matching locations
    MatchedSubstring:
      type: object
      description: Describes a substring match within text
      properties:
        offset:
          type: integer
          description: The offset of the matched substring
          example: 0
        length:
          type: integer
          description: The length of the matched substring
          example: 6
    StructuredFormatting:
      type: object
      description: Structured formatting for autocomplete predictions
      properties:
        mainText:
          type: string
          description: Main text of the prediction (usually place name)
          example: Marina Split
        mainTextMatchedSubstrings:
          type: array
          items:
            $ref: '#/components/schemas/MatchedSubstring'
          description: Matched substrings in the main text
        secondaryText:
          type: string
          description: Secondary text (usually location)
          example: Split, Croatia
    AutocompletePrediction:
      type: object
      description: A place autocomplete prediction
      required:
        - description
        - placeId
        - structuredFormatting
        - types
      properties:
        description:
          type: string
          description: Human-readable description of the place
          example: Marina Split, Split, Croatia
        placeId:
          type: string
          description: Unique identifier for the place
          example: ChIJN1t_tDeuEmsRUsoyG83frY4
        structuredFormatting:
          $ref: '#/components/schemas/StructuredFormatting'
        types:
          type: array
          items:
            type: string
          description: Place types
          example:
            - marina
            - point_of_interest
            - establishment
        distanceMeters:
          type: integer
          description: Straight-line distance from origin (if origin provided)
          example: 1500
    AutocompleteResponse:
      type: object
      description: Response containing autocomplete predictions
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AutocompletePrediction'
          description: List of autocomplete predictions (max 5)
    OpeningHours:
      type: object
      description: Opening hours information for a place
      properties:
        openNow:
          type: boolean
          description: Whether the place is currently open
        weekdayText:
          type: array
          items:
            type: string
          description: Formatted opening hours for each day
          example:
            - 'Monday: 8:00 AM - 8:00 PM'
            - 'Tuesday: 8:00 AM - 8:00 PM'
    PlaceDetailsResponse:
      type: object
      description: Detailed information about a place
      required:
        - placeId
        - name
        - formattedAddress
        - coordinates
      properties:
        placeId:
          type: string
          description: Unique identifier for the place
          example: ChIJN1t_tDeuEmsRUsoyG83frY4
        name:
          type: string
          description: Human-readable name of the place
          example: Marina Split
        formattedAddress:
          type: string
          description: Full address of the place
          example: Obala Lazareta 1, 21000, Split, Croatia
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        types:
          type: array
          items:
            type: string
          example:
            - marina
            - point_of_interest
            - establishment
        addressComponents:
          type: array
          items:
            $ref: '#/components/schemas/AddressComponent'
        formattedPhoneNumber:
          type: string
          description: Phone number in local format
          example: (021) 555 1234
        internationalPhoneNumber:
          type: string
          description: Phone number in international format
          example: +385 21 555 1234
        website:
          type: string
          format: uri
          description: Place website
          example: https://www.marinasplit.hr
        rating:
          type: number
          format: float
          minimum: 1
          maximum: 5
          description: Average user rating
          example: 4.5
        userRatingsTotal:
          type: integer
          description: Total number of ratings
          example: 1250
        openingHours:
          $ref: '#/components/schemas/OpeningHours'
    GeocoderProblem:
      type: object
      description: RFC 7807 problem response for geocoder errors
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          enum:
            - /errors/geocoder-service-unavailable
            - /errors/invalid-coordinates
            - /errors/place-not-found
          example: /errors/geocoder-service-unavailable
        title:
          type: string
          example: Geocoding Service Unavailable
        status:
          type: integer
          example: 503
        detail:
          type: string
          example: The geocoding service is temporarily unavailable. Please try again later.
    PostStatus:
      type: string
      enum:
        - published
        - archived
        - expired
        - resolved
        - deleted
      description: >
        Post lifecycle status:

        - published: Active post, visible in feed, editable. Default status for all newly created
        posts.

        - archived: Author-archived post, visible only to author (non-editable, but can be
        soft-deleted)

        - expired: Automatic transition when expiresAt is reached
        (non-editable, but can be soft-deleted)

        - resolved: Manual resolution by author or alert validity votes
        (non-editable, but can be soft-deleted)

        - deleted: Soft-deleted post, inaccessible to everyone including author (final state, no
        operations allowed)


        Note: validity voting can resolve only posts whose content contains `alert`.

        Note: deleted posts return 404 for all API endpoints.

        Note: Non-editable statuses (archived, expired, resolved) cannot be modified via PATCH but
        author can soft-delete.
      example: published
    FilterablePostStatus:
      type: string
      enum:
        - published
        - archived
        - expired
        - resolved
      description: |
        Post statuses allowed for filtering in list endpoints.
        Excludes 'deleted' because soft-deleted posts are inaccessible to everyone.

        Invalid status values (e.g., 'deleted', 'paused', 'draft') will return 422 validation error.
      example: published
    ReactionType:
      type: string
      enum:
        - heart
        - thumbs_up
        - thumbs_down
        - laugh
        - wow
        - sad
        - fire
        - clap
        - party
        - thinking
        - anchor
        - sailboat
        - wave
        - sun
        - compass
        - fish
        - whale
        - dolphin
        - wind
        - lifesaver
      description: Curated set of 20 emoji reactions (10 standard + 10 sailing)
      example: heart
    ValidityVoteType:
      type: string
      enum:
        - confirm
        - report_invalid
      description: |
        Validity vote types for time-sensitive posts:
        - confirm: Information is still valid
        - report_invalid: Information is no longer valid
      example: confirm
    ReportReason:
      type: string
      enum:
        - spam
        - scam
        - offensive
        - misinformation
        - danger
        - other
      description: Reason for reporting a post
      example: spam
    ReportStatus:
      type: string
      enum:
        - pending
        - reviewed
        - dismissed
      description: Status of a post report
      example: pending
    ChatType:
      type: string
      enum:
        - ONE_TO_ONE
        - GROUP
        - CRUISE_QNA
        - CRUISE_GROUP
      description: |
        Type of chat:
        - ONE_TO_ONE: Private chat between two users
        - GROUP: Group chat between multiple users
        - CRUISE_QNA: Cruise Q&A chat (participants ask organizer)
        - CRUISE_GROUP: Cruise group chat (all participants)
      example: ONE_TO_ONE
    Chat:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 identifier
          example: 018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e
        type:
          $ref: '#/components/schemas/ChatType'
        lastMessage:
          $ref: '#/components/schemas/Message'
