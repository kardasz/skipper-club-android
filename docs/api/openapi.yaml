    MapCluster:
      type: object
      required:
        - kind
        - id
        - name
        - coordinates
        - geometry
        - count
        - types
        - bounds
      properties:
        kind:
          type: string
          enum:
            - cluster
        id:
          type: string
          description: Deterministic identifier of the form `cluster:<geohash>:<precision>`.
          example: cluster:u3wge:5
        name:
          type: string
          description: >-
            Localized cluster label (EN/PL). Format `"{count} items"` / `"{count} obiektów"`. When a
            single type accounts for ≥80% of the cluster, a typed label is used.
        coordinates:
          $ref: '#/components/schemas/MapCoordinates'
        geometry:
          $ref: '#/components/schemas/MapPointGeometry'
        count:
          type: integer
          minimum: 1
          description: >
            Number of source items represented by the cluster.


            On the in-memory clustering path (default for queries small enough to materialize),
            singleton cells return individual `item` entries instead of clusters, so `count` is ≥ 2.


            `count=1` clusters can appear in `summary` responses because summary mode wraps
            singleton cells consistently. They can also appear on the DB-aggregated path — taken for
            large totals or wide viewports (see the "DB-level clustering for large or wide queries"
            section in `docs/map/index.md`) — because individual rows never leave the database
            there. This means `count=1` clusters can appear in `auto`, `summary`, and
            `markers-degraded` responses.
        types:
          type: object
          properties:
            post:
              type: integer
              minimum: 1
            spot:
              type: integer
              minimum: 1
            check_in:
              type: integer
              minimum: 1
          additionalProperties: false
        bounds:
          $ref: '#/components/schemas/MapBounds'
    MapEntry:
      oneOf:
        - $ref: '#/components/schemas/MapItem'
        - $ref: '#/components/schemas/MapCluster'
      discriminator:
        propertyName: kind
        mapping:
          item: '#/components/schemas/MapItem'
          cluster: '#/components/schemas/MapCluster'
    MapItemsMeta:
      type: object
      required:
        - mode
        - detail
        - totalItems
        - returnedItems
        - topLevelEntries
        - hasMoreDetail
        - checkInFreshnessHours
        - appliedLimit
      properties:
        mode:
          type: string
          enum:
            - bounds
            - radius
        detail:
          type: string
          enum:
            - auto
            - markers
            - summary
            - markers-degraded
        totalItems:
          type: integer
          minimum: 0
          description: >-
            Total number of source items matching filters within the spatial area (post-visibility,
            pre-clustering).
        returnedItems:
          type: integer
          minimum: 0
          description: >-
            Number of source items represented in the response. For unclustered responses this
            equals `data.length`; for clustered responses this equals the sum of `count` for
            clusters plus the number of items.
        topLevelEntries:
          type: integer
          minimum: 0
          description: Number of top-level entries in `data` (items + clusters together).
        hasMoreDetail:
          type: boolean
          description: True if at least one `cluster` is present and zooming in would reveal individual items.
        checkInFreshnessHours:
          type: number
          description: The configured check-in freshness TTL in hours.
        appliedLimit:
          type: integer
          description: Echo of the requested `limit`.
        degradedToClusters:
          type: boolean
          description: >-
            Present and `true` when `detail=markers` was requested but the response was downgraded
            to clusters.
        truncated:
          type: boolean
          description: >-
            Present and `true` if the response was truncated to fit the limit even at coarsest
            clustering precision.
        truncatedItems:
          type: integer
          minimum: 0
          description: Number of source items omitted by truncation.
