                detail: 'The CAPTCHA verification service is temporarily unavailable'

  /auth/password-reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using verification code
      description: |
        Sets a new password for the user identified by the supplied email and reset code.
        On success, all existing sessions for the user are revoked and the user must log in again
        with the new password. Always returns 401 for invalid code, expired code, or unknown user
        to prevent enumeration.

        Password requirements:

        - 8-128 characters
        - At least one letter
        - At least one digit
        - At least one special character (any non-alphanumeric, non-whitespace character)
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
                  example: jan.kowalski@email.com
                code:
                  type: string
                  pattern: '^\d{6}$'
                  minLength: 6
                  maxLength: 6
                  description: 6-digit password reset code received by email
                  example: '123456'
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: |
                    New password. Must contain at least one letter, one digit, and one
                    special character.
                  example: NewSecurePass123!
      responses:
        '204':
          description: Password reset successful; existing sessions revoked
        '401':
          description: Invalid, expired, or unknown reset code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthProblem'
              examples:
                invalidCode:
                  value:
                    type: '/errors/invalid-password-reset-code'
                    title: 'Invalid Reset Code'
                    status: 401
                    detail: 'The password reset code is invalid or has expired'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                weakPassword:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'password'
                        message: 'password must contain at least one letter, one digit and one special character'
                missingCode:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'code'
                        message: 'code is required'
        '429':
          description: Too many failed attempts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthProblem'
              example:
                type: '/errors/password-reset-rate-limit'
                title: 'Too Many Requests'
                status: 429
                detail: 'Please wait before requesting another password reset'

