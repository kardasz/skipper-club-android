  /invitations:
    get:
      operationId: listInvitations
      tags:
        - invitations
      summary: List all invitations (Admin only)
      description: |
        Returns a paginated list of invitations.
        Only accessible by administrators.
        Soft-deleted invitations are excluded.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvitationStatus'
          description: Filter by invitation status
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of results to return
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of results to skip
      responses:
        '200':
          description: List of invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: sendInvitation
      tags:
        - invitations
      summary: Send an invitation (Admin only)
      description: |
        Sends an invitation email to a new user.
        Only accessible by administrators.
        The recipient email must not already be registered.
        If an active invitation already exists for the email, it is soft-deleted
        and a new invitation is created.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
                  description: Email address of the person to invite
                  example: friend@email.com
      responses:
        '204':
          description: Invitation sent successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict - email already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvitationProblem'
              examples:
                emailAlreadyRegistered:
                  value:
                    type: /errors/invitation-email-already-registered
                    title: Email Already Registered
                    status: 409
                    detail: This email address is already registered
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /invitations/{id}:
    delete:
      operationId: deleteInvitation
      tags:
        - invitations
      summary: Delete an invitation (Admin only)
      description: |
        Soft-deletes an invitation by ID.
        Only accessible by administrators.
        The invitation cannot be used for registration after deletion.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Invitation ID
      responses:
        '204':
          description: Invitation deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Invitation not found or already deleted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvitationProblem'
              examples:
                notFound:
                  value:
                    type: /errors/invitation-not-found
                    title: Invitation Not Found
                    status: 404
                    detail: The invitation was not found or has already been deleted
  /invitations/register:
    post:
      operationId: registerByCode
      tags:
        - invitations
      summary: Register using invitation code
      description: |
        Creates a new user account using an invitation code.
        The email must match the invitation email exactly.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XTurnstileToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name
                - email
                - password
              properties:
                code:
                  type: string
                  pattern: ^[A-Z0-9]{8}$
                  minLength: 8
                  maxLength: 8
                  description: 8-character invitation code
                  example: ABC12345
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: User's full name
                  example: Jan Kowalski
                email:
                  type: string
                  format: email
                  maxLength: 320
                  description: Must match the invitation email
                  example: jan.kowalski@email.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: |
                    Must contain at least one letter, one digit, and one special character.
                  example: securePassword123!
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid invitation or email mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvitationProblem'
              examples:
                invalidInvitation:
                  value:
                    type: /errors/invalid-invitation
                    title: Invalid Invitation
                    status: 400
                    detail: The invitation is invalid, expired, or has already been used
                emailMismatch:
                  value:
                    type: /errors/invitation-email-mismatch
                    title: Email Mismatch
                    status: 400
                    detail: The email address does not match the invitation
        '403':
          description: CAPTCHA verification failed or token missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvitationProblem'
              examples:
                captchaTokenMissing:
                  value:
                    type: /errors/captcha-token-missing
                    title: CAPTCHA Token Required
                    status: 403
                    detail: A CAPTCHA verification token is required
                captchaVerificationFailed:
                  value:
                    type: /errors/captcha-verification-failed
                    title: CAPTCHA Verification Failed
                    status: 403
                    detail: The CAPTCHA verification failed. Please try again.
        '409':
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvitationProblem'
              examples:
                emailAlreadyRegistered:
                  value:
                    type: /errors/invitation-email-already-registered
                    title: Email Already Registered
                    status: 409
                    detail: This email address is already registered
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: CAPTCHA verification service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvitationProblem'
              examples:
                captchaServiceUnavailable:
                  value:
                    type: /errors/captcha-service-unavailable
                    title: CAPTCHA Service Unavailable
                    status: 503
                    detail: The CAPTCHA verification service is temporarily unavailable
