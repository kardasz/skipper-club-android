  /cruises/{cruiseId}/reviews:
    get:
      operationId: listCruiseReviews
      tags: [cruises]
      summary: Get published reviews for a cruise
      description: Returns only published reviews (both parties submitted) for the cruise. Any authenticated user can see reviews for public cruises. For private cruises, only organizer and accepted participants can access reviews.
      parameters:
        - name: cruiseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Cruise UUID v7 identifier
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of reviews to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of reviews to skip
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: List of published reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewsList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Private cruise - access forbidden
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CruisesProblem'
        '404':
          description: Cruise not found
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CruisesProblem'

    post:
      operationId: createCruiseReview
      tags: [cruises]
      summary: Submit blind review for cruise participant
      description: Submit review for a crew member after cruise completion. Reviews are blind (hidden) until both parties submit reviews. Once both submit, both reviews become published (visible).
      parameters:
        - name: cruiseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Cruise UUID v7 identifier
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '201':
          description: Review submitted successfully
          headers:
            Location:
              description: URI of the created review
              schema:
                type: string
                format: uri
                example: 'https://api.skipperclub.app/v1/cruises/01234567-89ab-cdef-0123-456789abcdef/reviews/01234567-89ab-cdef-0123-456789abcdef'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Not an accepted participant
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CruisesProblem'
              examples:
                notParticipant:
                  value:
                    type: '/errors/not-cruise-participant'
                    title: 'Not Cruise Participant'
                    status: 403
                    detail: 'Only accepted participants can submit reviews'
        '404':
          description: Cruise or reviewed user not found
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CruisesProblem'
        '422':
          description: Validation error or business rule violation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CruisesProblem'
              examples:
                cruiseNotCompleted:
                  value:
                    type: '/errors/cruise-not-completed'
                    title: 'Cruise Not Completed'
                    status: 422
                    detail: 'Cannot submit review for cruise that has not completed yet'
                alreadyReviewed:
                  value:
                    type: '/errors/review-already-exists'
                    title: 'Review Already Exists'
                    status: 422
                    detail: 'You have already reviewed this participant for this cruise'
                cannotReviewSelf:
                  value:
                    type: '/errors/cannot-review-self'
                    title: 'Cannot Review Self'
                    status: 422
                    detail: 'You cannot submit a review for yourself'

  # Invitations endpoints
  /invitations:
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: List all invitations (Admin only)
      description: |
        Returns a paginated list of invitations.
        Only accessible by administrators.
        Soft-deleted invitations are excluded.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvitationStatus'
          description: Filter by invitation status
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of results to return
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of results to skip
      responses:
        '200':
          description: List of invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: sendInvitation
      tags: [invitations]
      summary: Send an invitation (Admin only)
      description: |
        Sends an invitation email to a new user.
        Only accessible by administrators.
        The recipient email must not already be registered.
        If an active invitation already exists for the email, it is soft-deleted
        and a new invitation is created.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
                  description: Email address of the person to invite
                  example: friend@email.com
      responses:
        '204':
          description: Invitation sent successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict - email already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvitationProblem'
              examples:
                emailAlreadyRegistered:
                  value:
                    type: '/errors/invitation-email-already-registered'
                    title: 'Email Already Registered'
                    status: 409
                    detail: 'This email address is already registered'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'

  /invitations/{id}:
    delete:
      operationId: deleteInvitation
      tags: [invitations]
      summary: Delete an invitation (Admin only)
      description: |
        Soft-deletes an invitation by ID.
        Only accessible by administrators.
        The invitation cannot be used for registration after deletion.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Invitation ID
      responses:
        '204':
          description: Invitation deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Invitation not found or already deleted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvitationProblem'
              examples:
                notFound:
                  value:
                    type: '/errors/invitation-not-found'
                    title: 'Invitation Not Found'
                    status: 404
                    detail: 'The invitation was not found or has already been deleted'

  /invitations/register:
    post:
      operationId: registerByCode
      tags: [invitations]
      summary: Register using invitation code
      description: |
        Creates a new user account using an invitation code.
        The email must match the invitation email exactly.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XTurnstileToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, email, password]
              properties:
                code:
                  type: string
                  pattern: '^[A-Z0-9]{8}$'
                  minLength: 8
                  maxLength: 8
                  description: 8-character invitation code
                  example: 'ABC12345'
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: User's full name
                  example: Jan Kowalski
                email:
                  type: string
                  format: email
                  maxLength: 320
                  description: Must match the invitation email
                  example: jan.kowalski@email.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: |
                    Must contain at least one letter, one digit, and one special character.
                  example: securePassword123!
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid invitation or email mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvitationProblem'
              examples:
                invalidInvitation:
                  value:
                    type: '/errors/invalid-invitation'
                    title: 'Invalid Invitation'
                    status: 400
                    detail: 'The invitation is invalid, expired, or has already been used'
                emailMismatch:
                  value:
                    type: '/errors/invitation-email-mismatch'
                    title: 'Email Mismatch'
                    status: 400
                    detail: 'The email address does not match the invitation'
        '403':
          description: CAPTCHA verification failed or token missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvitationProblem'
              examples:
                captchaTokenMissing:
                  value:
                    type: '/errors/captcha-token-missing'
                    title: 'CAPTCHA Token Required'
                    status: 403
                    detail: 'A CAPTCHA verification token is required'
                captchaVerificationFailed:
                  value:
                    type: '/errors/captcha-verification-failed'
                    title: 'CAPTCHA Verification Failed'
                    status: 403
                    detail: 'The CAPTCHA verification failed. Please try again.'
        '409':
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvitationProblem'
              examples:
                emailAlreadyRegistered:
                  value:
                    type: '/errors/invitation-email-already-registered'
                    title: 'Email Already Registered'
                    status: 409
                    detail: 'This email address is already registered'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: CAPTCHA verification service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvitationProblem'
              examples:
                captchaServiceUnavailable:
                  value:
                    type: '/errors/captcha-service-unavailable'
                    title: 'CAPTCHA Service Unavailable'
                    status: 503
                    detail: 'The CAPTCHA verification service is temporarily unavailable'

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List or search users
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - $ref: '#/components/parameters/Order'
        - name: search
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 100
          description: Search phrase to filter users
        - $ref: '#/components/parameters/SortUsers'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersList'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: registerUser
      tags: [users]
      summary: Register new user account
      description: Creates a new user account and automatically logs them in, returning JWT tokens.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: User's full name
                  example: Jan Kowalski
                email:
                  type: string
                  format: email
                  maxLength: 320
                  description: User's email address (must be unique)
                  example: jan.kowalski@email.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: |
                    User's password. Must contain at least one letter, one digit, and one special character.
                  example: SecurePass123!
      responses:
        '201':
          description: User registered successfully
          headers:
            Location:
              description: URI of the created session
              schema:
                type: string
                format: uri
                example: 'https://api.skipperclub.app/v1/sessions/01234567-89ab-cdef-0123-456789abcdef'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '422':
          description: Validation error or email already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                missingName:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'name'
                        message: 'name is required'
                missingEmail:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'email'
                        message: 'email is required'
                invalidEmailFormat:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'email'
                        message: 'email must be a valid email address'
                missingPassword:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'password'
                        message: 'password is required'
                shortPassword:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'password'
