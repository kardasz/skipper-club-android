      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Token unregistered (idempotent)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /push/tokens/unregister:
    post:
      operationId: unregisterPushTokenByToken
      tags: [push]
      summary: Unregister push token using platform + token
      description: |
        Optional safety endpoint when `deviceId` is unavailable.
        Returns 403 if the token belongs to another user.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenUnregisterRequest'
      responses:
        '204':
          description: Token unregistered (idempotent)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Push token belongs to another user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PushProblem'
              examples:
                pushTokenOwnershipForbidden:
                  value:
                    type: '/errors/push-token-ownership-forbidden'
                    title: 'Push Token Access Forbidden'
                    status: 403
                    detail: 'You are not allowed to modify this push token'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Spots ────────────────────────────────────────────────────────────
    CoordinatesResponse:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    PhoneContactResponse:
      type: object
      required: [id, label, phone, extension, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: [string, 'null']
        phone:
          type: string
        extension:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RadioChannelResponse:
      type: object
      required: [id, name, channelKind, vhfChannel, frequencyMhz, channelNormalized, isPrimary, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        channelKind:
          type: string
          enum: [vhf, mhz]
        vhfChannel:
          type: [integer, 'null']
        frequencyMhz:
          type: [string, 'null']
        channelNormalized:
          type: string
        isPrimary:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SpotResponse:
      type: object
      required: [id, name, coordinates, phoneContacts, radioChannels, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        coordinates:
          $ref: '#/components/schemas/CoordinatesResponse'
        distanceMeters:
          type: number
          description: Present only when geo-radius search was used
        phoneContacts:
          type: array
          items:
            $ref: '#/components/schemas/PhoneContactResponse'
        radioChannels:
          type: array
          items:
            $ref: '#/components/schemas/RadioChannelResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SpotsListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SpotResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      required: [total, limit, offset, hasMore]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    CreatePhoneContactRequest:
      type: object
      required: [phone]
      properties:
        label:
          type: string
          maxLength: 100
        phone:
          type: string
          description: International phone number starting with +
        extension:
          type: string
          maxLength: 20

    CreateRadioChannelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        vhfChannel:
          type: integer
          minimum: 1
          maximum: 88
        frequencyMhz:
          type: number
        isPrimary:
          type: boolean
          default: false

    CreateSpotRequest:
      type: object
      required: [name, coordinates]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        coordinates:
          $ref: '#/components/schemas/CoordinatesResponse'
        phoneContacts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CreatePhoneContactRequest'
        radioChannels:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CreateRadioChannelRequest'

    UpdatePhoneContactRequest:
      type: object
      required: [contactId]
      properties:
        contactId:
          type: string
          format: uuid
        label:
          type: [string, 'null']
        phone:
          type: string
        extension:
          type: [string, 'null']

    UpdateRadioChannelRequest:
      type: object
      required: [channelId]
      properties:
        channelId:
          type: string
          format: uuid
        name:
          type: string
        vhfChannel:
          type: integer
        frequencyMhz:
          type: number
        isPrimary:
          type: boolean

    PhoneContactsUpdateRequest:
      type: object
      properties:
        create:
          type: array
          items:
            $ref: '#/components/schemas/CreatePhoneContactRequest'
        update:
          type: array
          items:
            $ref: '#/components/schemas/UpdatePhoneContactRequest'
        delete:
          type: array
          items:
            type: string
            format: uuid

    RadioChannelsUpdateRequest:
      type: object
      properties:
        create:
          type: array
          items:
            $ref: '#/components/schemas/CreateRadioChannelRequest'
        update:
          type: array
          items:
            $ref: '#/components/schemas/UpdateRadioChannelRequest'
        delete:
          type: array
          items:
            type: string
            format: uuid

    UpdateSpotAggregateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        coordinates:
          $ref: '#/components/schemas/CoordinatesResponse'
        phoneContacts:
          $ref: '#/components/schemas/PhoneContactsUpdateRequest'
        radioChannels:
          $ref: '#/components/schemas/RadioChannelsUpdateRequest'

    SpotChangeRequestStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]

    SpotChangeRequestType:
      type: string
      enum:
        - SPOT_CREATE
        - SPOT_UPDATE
        - SPOT_DELETE_REQUEST
        - PHONE_CONTACT_CREATE
        - PHONE_CONTACT_UPDATE
        - PHONE_CONTACT_DELETE_REQUEST
        - RADIO_CHANNEL_CREATE
        - RADIO_CHANNEL_UPDATE
        - RADIO_CHANNEL_DELETE_REQUEST

    SpotCreatePayload:
      type: object
      required: [name, coordinates]
      properties:
        name:
          type: string
        coordinates:
          $ref: '#/components/schemas/CoordinatesResponse'
        phoneContacts:
          type: array
          items:
            $ref: '#/components/schemas/CreatePhoneContactRequest'
        radioChannels:
          type: array
          items:
            $ref: '#/components/schemas/CreateRadioChannelRequest'

    SpotUpdatePayload:
      type: object
      required: [spotId]
      properties:
        spotId:
          type: string
          format: uuid
        name:
          type: string
        coordinates:
          $ref: '#/components/schemas/CoordinatesResponse'

    SpotDeleteRequestPayload:
      type: object
      required: [spotId]
      properties:
        spotId:
          type: string
          format: uuid

    PhoneContactCreatePayload:
      type: object
      required: [spotId, phone]
      properties:
        spotId:
          type: string
          format: uuid
        label:
          type: string
        phone:
          type: string
        extension:
          type: string

    PhoneContactUpdatePayload:
      type: object
      required: [spotId, contactId]
      properties:
        spotId:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid
        label:
          type: [string, 'null']
        phone:
          type: string
        extension:
          type: [string, 'null']

    PhoneContactDeleteRequestPayload:
      type: object
      required: [spotId, contactId]
      properties:
        spotId:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid

    RadioChannelCreatePayload:
      type: object
      required: [spotId, name]
      properties:
        spotId:
          type: string
          format: uuid
        name:
          type: string
        vhfChannel:
          type: integer
        frequencyMhz:
          type: number
        isPrimary:
          type: boolean

    RadioChannelUpdatePayload:
      type: object
      required: [spotId, channelId]
      properties:
        spotId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        name:
          type: string
        vhfChannel:
          type: integer
        frequencyMhz:
          type: number
        isPrimary:
          type: boolean

    RadioChannelDeleteRequestPayload:
      type: object
      required: [spotId, channelId]
      properties:
        spotId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid

    CreateSpotChangeRequestRequest:
      type: object
      required: [type, payload]
      properties:
        type:
          $ref: '#/components/schemas/SpotChangeRequestType'
        comment:
          type: string
          maxLength: 2000
          description: Required for delete-type requests
        payload:
          oneOf:
            - $ref: '#/components/schemas/SpotCreatePayload'
            - $ref: '#/components/schemas/SpotUpdatePayload'
            - $ref: '#/components/schemas/SpotDeleteRequestPayload'
            - $ref: '#/components/schemas/PhoneContactCreatePayload'
            - $ref: '#/components/schemas/PhoneContactUpdatePayload'
            - $ref: '#/components/schemas/PhoneContactDeleteRequestPayload'
            - $ref: '#/components/schemas/RadioChannelCreatePayload'
            - $ref: '#/components/schemas/RadioChannelUpdatePayload'
            - $ref: '#/components/schemas/RadioChannelDeleteRequestPayload'

    SpotChangeRequestResponse:
      type: object
      required: [id, type, status, comment, payload, requestedByUserId, reviewedByUserId, reviewedAt, rejectionReason, cancelledAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/SpotChangeRequestType'
        status:
          $ref: '#/components/schemas/SpotChangeRequestStatus'
        comment:
          type: [string, 'null']
        payload:
          type: object
        requestedByUserId:
          type: string
          format: uuid
        reviewedByUserId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        reviewedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        rejectionReason:
          type: [string, 'null']
        cancelledAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SpotChangeRequestsListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SpotChangeRequestResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    BatchTransitionChangeRequestsRequest:
      type: object
      required: [ids, action]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        action:
          type: string
          enum: [approve, reject, cancel]
        rejectionReason:
          type: string
          maxLength: 1000
          description: Required when action is reject

    BatchTransitionResultItemSuccess:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SpotChangeRequestStatus'
        appliedResource:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
              format: uuid

    BatchTransitionResultItemError:
      type: object
      required: [id, error]
      properties:
        id:
          type: string
          format: uuid
        error:
          $ref: '#/components/schemas/ApiProblem'

    BatchTransitionResult:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/BatchTransitionResultItemSuccess'
              - $ref: '#/components/schemas/BatchTransitionResultItemError'
        meta:
          type: object
          required: [requested, succeeded, failed]
          properties:
            requested:
              type: integer
            succeeded:
              type: integer
            failed:
              type: integer

    ApiProblem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type
        title:
          type: string
          description: A short, human-readable summary of the problem type
        status:
          type: integer
          description: The HTTP status code
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem

    NearbySpotItem:
      type: object
      required: [id, name, coordinates, distanceMeters]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        coordinates:
          type: object
          required: [lat, lng]
          properties:
            lat:
              type: number
              format: double
            lng:
              type: number
              format: double
        distanceMeters:
          type: integer
          description: Distance in meters from the proposed spot location

    SpotDuplicateProblem:
      allOf:
        - $ref: '#/components/schemas/ApiProblem'
        - type: object
          properties:
            nearbySpots:
              type: array
              description: Existing spots that triggered the duplicate check
              items:
                $ref: '#/components/schemas/NearbySpotItem'

    # ─── Existing schemas ────────────────────────────────────────────────────
    PostPermissions:
      type: object
      required:
        [
          edit,
          delete,
          archive,
          resolve,
          comment,
          react,
          bookmark,
          report,
          validityVote,
        ]
      description: |
        Permissions that the current user has for the post.
        Author-only permissions: edit, delete, archive, resolve
        Interaction permissions: comment, react, bookmark, report, validityVote
      properties:
        # Post management (author only)
        edit:
          type: boolean
          description: Whether current user can edit this post (PATCH /posts/{id})
          example: true
        delete:
          type: boolean
          description: Whether current user can delete this post (DELETE /posts/{id})
          example: true
        archive:
          type: boolean
          description: Whether current user can archive this post (PATCH with status=archived)
          example: true
        resolve:
          type: boolean
          description: Whether current user can resolve this post (PATCH with status=resolved, time-sensitive types only)
          example: false
        # Interactions (D4 - available for all users on published, non-expired posts)
        comment:
          type: boolean
          description: Whether current user can comment on this post
          example: true
        react:
          type: boolean
          description: Whether current user can add/remove reactions on this post
          example: true
        bookmark:
          type: boolean
          description: Whether current user can bookmark this post
          example: true
        report:
          type: boolean
          description: Whether current user can report this post
          example: true
        validityVote:
          type: boolean
          description: Whether current user can vote on this post's validity (votable types only - berth, weather, navigation_warning)
          example: false

    Coordinates:
      type: object
      description: Geographic coordinates (WGS84)
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude (-90 to 90)
          example: 43.5081
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude (-180 to 180)
          example: 16.4402

    AddressComponent:
      type: object
      description: A component of an address (city, country, etc.)
      properties:
        longName:
          type: string
          description: Full name of the component
          example: 'Split'
        shortName:
          type: string
          description: Abbreviated name of the component
          example: 'Split'
        types:
          type: array
          items:
            type: string
          description: Type classifications for this component
          example: ['locality', 'political']

    GeocoderLocation:
      type: object
      description: A geocoded location or place result
      required:
        - formattedAddress
        - coordinates
      properties:
        formattedAddress:
          type: string
          description: Full formatted address string
          example: 'Split, Croatia'
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        placeId:
          type: string
          description: Google Place ID for further lookups
          example: 'ChIJLYsKc_FPahQRq0aE88E8eUE'
        types:
          type: array
          items:
            type: string
          description: Address type classifications from Google
          example: ['locality', 'political']
        addressComponents:
          type: array
          items:
            $ref: '#/components/schemas/AddressComponent'
          description: Detailed breakdown of the address
        name:
          type: string
          description: Place or business name (only for search results, not reverse geocoding)
          example: 'ACI Marina Split'
        rating:
          type: number
          format: double
          minimum: 1
          maximum: 5
          description: Place rating from 1.0 to 5.0 (only for places with ratings)
          example: 4.5
        userRatingsTotal:
          type: integer
          description: Total number of user ratings for this place
          example: 1250

    GeocoderSearchResponse:
      type: object
      description: Response containing geocoding results
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GeocoderLocation'
          description: List of matching locations

    MatchedSubstring:
      type: object
      description: Describes a substring match within text
      properties:
        offset:
          type: integer
          description: The offset of the matched substring
          example: 0
        length:
          type: integer
          description: The length of the matched substring
          example: 6

    StructuredFormatting:
      type: object
      description: Structured formatting for autocomplete predictions
      properties:
        mainText:
          type: string
          description: Main text of the prediction (usually place name)
          example: 'Marina Split'
        mainTextMatchedSubstrings:
          type: array
          items:
            $ref: '#/components/schemas/MatchedSubstring'
          description: Matched substrings in the main text
        secondaryText:
          type: string
          description: Secondary text (usually location)
          example: 'Split, Croatia'

    AutocompletePrediction:
      type: object
      description: A place autocomplete prediction
      required:
        - description
        - placeId
        - structuredFormatting
        - types
      properties:
        description:
          type: string
          description: Human-readable description of the place
          example: 'Marina Split, Split, Croatia'
        placeId:
          type: string
          description: Unique identifier for the place
          example: 'ChIJN1t_tDeuEmsRUsoyG83frY4'
        structuredFormatting:
          $ref: '#/components/schemas/StructuredFormatting'
        types:
          type: array
          items:
            type: string
          description: Place types
          example: ['marina', 'point_of_interest', 'establishment']
        distanceMeters:
          type: integer
          description: Straight-line distance from origin (if origin provided)
          example: 1500

    AutocompleteResponse:
      type: object
      description: Response containing autocomplete predictions
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AutocompletePrediction'
          description: List of autocomplete predictions (max 5)

    OpeningHours:
      type: object
      description: Opening hours information for a place
      properties:
        openNow:
          type: boolean
          description: Whether the place is currently open
        weekdayText:
          type: array
          items:
            type: string
          description: Formatted opening hours for each day
          example: ['Monday: 8:00 AM - 8:00 PM', 'Tuesday: 8:00 AM - 8:00 PM']

    PlaceDetailsResponse:
      type: object
      description: Detailed information about a place
      required:
        - placeId
        - name
        - formattedAddress
        - coordinates
      properties:
        placeId:
          type: string
          description: Unique identifier for the place
          example: 'ChIJN1t_tDeuEmsRUsoyG83frY4'
        name:
          type: string
          description: Human-readable name of the place
          example: 'Marina Split'
        formattedAddress:
          type: string
          description: Full address of the place
          example: 'Obala Lazareta 1, 21000, Split, Croatia'
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        types:
          type: array
          items:
            type: string
          example: ['marina', 'point_of_interest', 'establishment']
        addressComponents:
          type: array
          items:
            $ref: '#/components/schemas/AddressComponent'
        formattedPhoneNumber:
          type: string
          description: Phone number in local format
          example: '(021) 555 1234'
        internationalPhoneNumber:
          type: string
          description: Phone number in international format
          example: '+385 21 555 1234'
        website:
          type: string
          format: uri
          description: Place website
          example: 'https://www.marinasplit.hr'
        rating:
          type: number
          format: float
          minimum: 1
          maximum: 5
          description: Average user rating
          example: 4.5
        userRatingsTotal:
          type: integer
          description: Total number of ratings
          example: 1250
        openingHours:
          $ref: '#/components/schemas/OpeningHours'

    GeocoderProblem:
      type: object
      description: RFC 7807 problem response for geocoder errors
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          enum:
            - '/errors/geocoder-service-unavailable'
            - '/errors/invalid-coordinates'
            - '/errors/place-not-found'
          example: '/errors/geocoder-service-unavailable'
        title:
          type: string
          example: 'Geocoding Service Unavailable'
        status:
          type: integer
          example: 503
        detail:
          type: string
          example: 'The geocoding service is temporarily unavailable. Please try again later.'

    RouteStop:
      type: object
      description: A waypoint/stop on a sailing route
      required: [name, coordinates]
      properties:
        name:
          type: string
          maxLength: 255
          description: Name of the stop (e.g., "Hvar", "Korcula")
          example: 'Hvar'
        coordinates:
          $ref: '#/components/schemas/Coordinates'

    PostType:
      type: string
      enum:
        - photo
        - place
        - food
        - spot
        - tips
        - route
        - berth
        - weather
        - navigation_warning
        - help
      description: |
        Post type classification:
        - photo: Photo/Travel posts (evergreen, media required)
        - place: Places to Visit (evergreen)
        - food: Recommended Food Spots (evergreen)
        - spot: Recommended Marinas (evergreen)
        - tips: Tips & Experience (evergreen)
        - route: Recommended Route (evergreen)
        - berth: Berth Availability (expires in 6 hours)
        - weather: Weather Conditions (expires in 7 days)
        - navigation_warning: Navigation Warnings (expires in 7 days)
        - help: Help/Assistance requests (expires in 3 days)
      example: 'photo'

    PostStatus:
      type: string
      enum:
        - published
        - archived
        - expired
        - resolved
        - deleted
      description: |
        Post lifecycle status:
        - published: Active post, visible in feed, editable. Default status for all newly created posts.
        - archived: Author-archived post, visible only to author (non-editable, but can be soft-deleted)
        - expired: Automatic transition when expiresAt is reached, time-sensitive types only (non-editable, but can be soft-deleted)
        - resolved: Manual resolution by author or community votes, time-sensitive types only (non-editable, but can be soft-deleted)
        - deleted: Soft-deleted post, inaccessible to everyone including author (final state, no operations allowed)

        Note: expired and resolved are only valid for time-sensitive post types (berth, weather, navigation_warning, help).
        Note: deleted posts return 404 for all API endpoints.
        Note: Non-editable statuses (archived, expired, resolved) cannot be modified via PATCH but author can soft-delete.
      example: 'published'

    FilterablePostStatus:
      type: string
      enum:
        - published
        - archived
        - expired
        - resolved
      description: |
        Post statuses allowed for filtering in list endpoints.
        Excludes 'deleted' because soft-deleted posts are inaccessible to everyone.

        Invalid status values (e.g., 'deleted', 'paused', 'draft') will return 422 validation error.
      example: 'published'

    ReactionType:
      type: string
      enum:
        - heart
        - thumbs_up
        - thumbs_down
        - laugh
        - wow
        - sad
        - fire
        - clap
        - party
        - thinking
        - anchor
        - sailboat
        - wave
        - sun
        - compass
        - fish
        - whale
        - dolphin
        - wind
        - lifesaver
      description: Curated set of 20 emoji reactions (10 standard + 10 sailing)
      example: 'heart'

    ValidityVoteType:
      type: string
      enum:
        - confirm
        - report_invalid
      description: |
        Validity vote types for time-sensitive posts:
        - confirm: Information is still valid
        - report_invalid: Information is no longer valid
      example: 'confirm'

    ReportReason:
      type: string
      enum:
        - spam
        - scam
        - offensive
        - misinformation
        - danger
        - other
      description: Reason for reporting a post
      example: 'spam'

    ReportStatus:
      type: string
      enum:
        - pending
        - reviewed
        - dismissed
      description: Status of a post report
      example: 'pending'

    CrossRegionPostType:
      type: string
      enum:
        - photo
        - place
        - food
        - spot
        - tips
        - route
      description: |
        Evergreen post types allowed in crossRegionTypes parameter.
        Time-sensitive types (berth, weather, navigation_warning, help) are NOT allowed
        as cross-region types - they are always filtered by regionCode.
      example: 'photo'

    ChatType:
      type: string
      enum: [ONE_TO_ONE, GROUP, CRUISE_QNA, CRUISE_GROUP]
      description: |
        Type of chat:
        - ONE_TO_ONE: Private chat between two users
        - GROUP: Group chat between multiple users
        - CRUISE_QNA: Cruise Q&A chat (participants ask organizer)
        - CRUISE_GROUP: Cruise group chat (all participants)
      example: 'ONE_TO_ONE'

    Chat:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 identifier
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        type:
          $ref: '#/components/schemas/ChatType'
        lastMessage:
          $ref: '#/components/schemas/Message'
          nullable: true
          description: Last message in the chat
        lastReadMessageId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          description: ID of last message read by current user
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        name:
          anyOf:
            - type: string
            - type: 'null'
          description: Chat name (for group chats) or null for 1:1 chats
          example: 'Ekipa na Mazury 2025'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: List of chat participants
        relatedCruiseId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          description: Related cruise ID for cruise-related chats
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        unreadCount:
          type: integer
          description: Number of unread messages for current user
          example: 3
        updatedAt:
          type: string
          format: date-time
          description: When the chat was last updated

    ChatsList:
      type: object
      properties:
        chats:
          type: array
          items:
            $ref: '#/components/schemas/Chat'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    ChatCreate:
      type: object
      required: [participantIds]
      properties:
        participantIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: List of participant user IDs. Friendship between participants is not required.
          example:
            [
              '018e3b2e-8e3b-7b2e-8e3b-7b2e8e3b7b2e',
              '018e3b2e-8e3b-7b2e-8e3b-7b2e8e3b7b2f',
            ]
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional name for group chat (required for groups with 3+ participants)
          example: 'Ekipa na Mazury'

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 identifier
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        user:
          $ref: '#/components/schemas/User'
        text:
          type: string
          example: 'Amazing view! Where exactly was this taken?'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CommentsList:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    FriendRequestState:
      type: string
      enum: [pending, sent, accepted, rejected, canceled]
      description: |
        Request state:
        - pending: User received request from another user (can accept/reject)
        - sent: User sent request to another user (can cancel)
        - accepted: Request confirmed
        - rejected: Request declined
        - canceled: Request canceled
      example: 'pending'

    FriendshipStatus:
      type: string
      enum: [none, pending, accepted]
      description: |
        Friendship status between current user and target user:
        - none: No friendship or pending request exists
        - pending: There is a pending friend request between users
        - accepted: Users are friends
      example: 'accepted'

    FriendRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 identifier for the friend request
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        user:
          $ref: '#/components/schemas/User'
        state:
          $ref: '#/components/schemas/FriendRequestState'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FriendRequestsList:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/FriendRequest'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    FriendRequestStateUpdate:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [accepted, rejected]
          description: New request state

    FriendsList:
      type: object
      properties:
        friends:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Media:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 identifier for the media file
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        type:
          type: string
          enum: [image, video]
          description: Media type
          example: image
        url:
          type: string
          format: uri
          description: URL of the media file
          example: 'https://cdn.skipperclub.com/posts/img-456.jpg'
        width:
          anyOf:
            - type: integer
            - type: 'null'
          description: Width in pixels
          example: 1920
        height:
          anyOf:
            - type: integer
            - type: 'null'
          description: Height in pixels
          example: 1080
        mimetype:
          type: string
          description: MIME type of the media file
          enum:
            - image/jpeg
            - image/png
            - image/heic
            - video/mp4
          example: 'image/jpeg'

    MediaList:
      type: array
      description: Array of media objects
      items:
        $ref: '#/components/schemas/Media'

    MediaSet:
      type: array
      description: Array of media file UUIDs
      minItems: 1
      maxItems: 10
      uniqueItems: true
      items:
        type: string
        format: uuid
        description: UUID v7 identifier of a media file
      example:
        [
          '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e',
          '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2f',
        ]

    PreSignedUrlRequest:
      type: object
      required: [fileName, fileType, fileSize]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the file to upload
          example: 'vacation-photo.jpg'
        fileType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/heic
            - video/mp4
          description: MIME type of the file
          example: 'image/jpeg'
        fileSize:
          type: integer
          minimum: 1
          maximum: 52428800
          description: Size of the file in bytes (max 10MB for images, 50MB for videos)
          example: 1048576
        width:
          type: integer
          minimum: 1
          description: Width of the image/video in pixels
          example: 1920
        height:
          type: integer
          minimum: 1
          description: Height of the image/video in pixels
          example: 1080
        duration:
          type: number
          minimum: 0
          description: Duration of the video in seconds
          example: 30.5
        camera:
          type: string
          description: Camera model or device used to capture the media
          example: 'iPhone 15 Pro'
        frameRate:
          type: number
          format: decimal
          minimum: 0
          maximum: 999.99
          description: Frame rate of the video (frames per second)
          example: 30.0
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude coordinate where the media was captured
          example: 54.3520
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude coordinate where the media was captured
          example: 18.6466
        orientation:
          type: integer
          minimum: 1
          maximum: 8
          description: EXIF orientation value (1-8)
          example: 1
        dateTaken:
          type: string
          format: date-time
          description: Date and time when the media was captured (ISO 8601 format)
          example: '2024-07-28T15:30:00Z'
        metadata:
          type: object
          description: Additional metadata about the media file
          additionalProperties: true
          example:
            iso: 100
            aperture: 'f/2.8'
            shutterSpeed: '1/1000'
            gpsAltitude: 10.5

    PreSignedUrlResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          format: uri
          description: Presigned URL for uploading the file
          example: 'https://uploads.skipperclub.com/presigned-upload-url'
        mediaId:
          type: string
          format: uuid
          description: UUID v7 identifier for the media record
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        publicUrl:
          type: string
          format: uri
          description: Public URL where the file will be accessible after upload
          example: 'https://cdn.skipperclub.com/media/018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'

    TranscriptionResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The transcribed text from the audio file
          example: 'Hello, this is a test transcription.'

    AvatarPreSignedUrlRequest:
      type: object
      required: [fileName, fileType, fileSize]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the avatar file to upload
          example: 'profile-avatar.jpg'
        fileType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/heic
          description: MIME type of the avatar file (images only)
          example: 'image/jpeg'
        fileSize:
          type: integer
          minimum: 1
          maximum: 10485760
          description: Size of the avatar file in bytes (max 10MB for images)
          example: 1048576
        width:
          type: integer
          minimum: 1
          description: Width of the avatar image in pixels
          example: 1024
        height:
          type: integer
          minimum: 1
          description: Height of the avatar image in pixels
          example: 1024
        camera:
          type: string
          description: Camera model or device used to capture the avatar
          example: 'iPhone 15 Pro'
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude coordinate where the avatar was captured
          example: 54.3520
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude coordinate where the avatar was captured
          example: 18.6466
        orientation:
          type: integer
          minimum: 1
          maximum: 8
          description: EXIF orientation value (1-8)
          example: 1
        dateTaken:
          type: string
          format: date-time
          description: Date and time when the avatar was captured (ISO 8601 format)
          example: '2024-07-28T15:30:00Z'
        metadata:
          type: object
          description: Additional metadata about the avatar file
          additionalProperties: true
          example:
            iso: 100
            aperture: 'f/2.8'
            shutterSpeed: '1/1000'
            gpsAltitude: 10.5

    AvatarPreSignedUrlResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          format: uri
          description: Presigned URL for uploading the avatar file
          example: 'https://uploads.skipperclub.com/presigned-upload-url'
        avatarId:
          type: string
          format: uuid
          description: UUID v7 identifier for the avatar record
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        publicUrl:
          type: string
          format: uri
          description: Public URL where the avatar will be accessible after upload
          example: 'https://cdn.skipperclub.com/avatars/018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'

    TaggedUserSet:
      type: array
      description: Array of tagged user UUIDs
      minItems: 0
      maxItems: 20
      uniqueItems: true
      items:
        type: string
        format: uuid
        description: UUID v7 identifier of a tagged user
      example:
        [
          '018e3b2e-8e3b-7b2e-8e3b-7b2e8e3b7b2e',
          '018e3b2e-8e3b-7b2e-8e3b-7b2e8e3b7b2f',
        ]

    CruiseCoordinates:
      type: object
      description: Geographic coordinates for cruise locations (WGS84)
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude (-90 to 90)
          example: 54.3520
        lng:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude (-180 to 180)
          example: 18.6466

    CruisePort:
      type: object
      description: A named port with geographic coordinates
      required: [name, coordinates]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
          description: Name of the port
          example: 'Gdańsk Marina'
        coordinates:
          $ref: '#/components/schemas/CruiseCoordinates'

    CruiseStop:
      type: object
      description: A named stop along the cruise route with geographic coordinates
      required: [name, coordinates]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the stop
          example: 'Hel Peninsula'
        coordinates:
          $ref: '#/components/schemas/CruiseCoordinates'

    CruiseStopSet:
      type: array
      description: Array of stops along the cruise route
      maxItems: 20
      items:
        $ref: '#/components/schemas/CruiseStop'
      example:
        - name: 'Hel Peninsula'
          coordinates: { lat: 54.6083, lng: 18.8003 }
        - name: 'Sopot Pier'
          coordinates: { lat: 54.4469, lng: 18.5601 }

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 identifier
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        user:
          $ref: '#/components/schemas/User'
          description: User who sent the message
        chatId:
          type: string
          format: uuid
          description: ID of the chat this message belongs to
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        read:
          type: boolean
          description: Whether the current user has read this message
          example: true
        text:
          type: string
          description: Message content
          example: 'Kiedy wypływamy?'
        createdAt:
          type: string
          format: date-time
          description: When the message was created
        updatedAt:
          type: string
          format: date-time
          description: When the message was last updated

    MessageCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: Message content
          example: 'Kiedy wypływamy?'

    MessagesList:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 identifier
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        user:
          $ref: '#/components/schemas/User'
        type:
          $ref: '#/components/schemas/PostType'
        status:
          $ref: '#/components/schemas/PostStatus'
        regionCode:
          type: string
          description: Sailing region identifier
          example: 'ADR-HR-CDAL'
        media:
          $ref: '#/components/schemas/MediaList'
        description:
          type: string
          description: Main textual content. Required for all types except photo.
          example: 'Beautiful sunset over the Baltic Sea'
        locationName:
          type: string
          description: Human-readable location name
          example: 'Gulf of Gdańsk'
        coordinates:
          oneOf:
            - $ref: '#/components/schemas/Coordinates'
            - type: 'null'
          description: Geographic coordinates (WGS84)
        hashtags:
          type: array
          items:
            type: string
          description: Hashtags extracted from description (without # prefix, lowercase)
          example: ['sailing', 'sunset', 'baltic']
        taggedUsers:
          type: array
          items:
            $ref: '#/components/schemas/User'
        # Route-specific fields (flat, only present for route type)
        stops:
          type: array
          items:
            $ref: '#/components/schemas/RouteStop'
          description: Route waypoints (only present for route type)
        durationDays:
          type: integer
          minimum: 1
          description: Recommended duration in days (only present for route type)
          example: 7
        lengthNm:
          type: number
          minimum: 0
          description: Route length in nautical miles (only present for route type)
          example: 140
        # Lifecycle timestamps
        expiresAt:
          type: ['string', 'null']
          format: date-time
          readOnly: true
          description: Expiration timestamp for time-sensitive types
        resolvedAt:
          type: ['string', 'null']
          format: date-time
          readOnly: true
          description: Resolution timestamp (when status transitioned to resolved)
        archivedAt:
          type: ['string', 'null']
          format: date-time
          readOnly: true
          description: Archival timestamp (when status transitioned to archived)
        deletedAt:
          type: ['string', 'null']
          format: date-time
          readOnly: true
          description: Soft deletion timestamp
        # Interaction counts and summaries
        commentsCount:
          type: integer
          example: 12
        reactions:
          $ref: '#/components/schemas/ReactionSummary'
        bookmarked:
          type: boolean
          description: Whether the current user has bookmarked this post
          example: false
        validityVotes:
          $ref: '#/components/schemas/VoteSummary'
          description: Validity voting summary (only present for votable types - berth, weather, navigation_warning)
        permissions:
          $ref: '#/components/schemas/PostPermissions'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PostCreate:
      oneOf:
        - $ref: '#/components/schemas/CreatePhotoPost'
        - $ref: '#/components/schemas/CreatePlacePost'
        - $ref: '#/components/schemas/CreateFoodPost'
        - $ref: '#/components/schemas/CreateSpotPost'
        - $ref: '#/components/schemas/CreateTipsPost'
        - $ref: '#/components/schemas/CreateRoutePost'
        - $ref: '#/components/schemas/CreateBerthPost'
        - $ref: '#/components/schemas/CreateWeatherPost'
        - $ref: '#/components/schemas/CreateNavigationWarningPost'
        - $ref: '#/components/schemas/CreateHelpPost'
      discriminator:
        propertyName: type
        mapping:
          photo: '#/components/schemas/CreatePhotoPost'
          place: '#/components/schemas/CreatePlacePost'
          food: '#/components/schemas/CreateFoodPost'
          spot: '#/components/schemas/CreateSpotPost'
          tips: '#/components/schemas/CreateTipsPost'
          route: '#/components/schemas/CreateRoutePost'
          berth: '#/components/schemas/CreateBerthPost'
          weather: '#/components/schemas/CreateWeatherPost'
          navigation_warning: '#/components/schemas/CreateNavigationWarningPost'
          help: '#/components/schemas/CreateHelpPost'

    CreatePhotoPost:
      type: object
      description: Create a photo/travel post (evergreen, media required)
      required: [type, regionCode, mediaIds]
      properties:
        type:
          type: string
          enum: [photo]
        regionCode:
          type: string
          maxLength: 50
          description: Sailing region identifier
          example: 'ADR-HR-CDAL'
        description:
          type: string
          maxLength: 2200
          description: Optional description for photo type
          example: 'Beautiful sunset over the Baltic Sea'
        locationName:
          type: string
          maxLength: 255
          example: 'Gulf of Gdańsk'
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        mediaIds:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uuid
          description: Required - at least one media item
        taggedUserIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid

    CreatePlacePost:
      type: object
      description: Create a places to visit post (evergreen)
      required: [type, regionCode, description, locationName, coordinates]
      properties:
        type:
          type: string
          enum: [place]
        regionCode:
          type: string
          maxLength: 50
          example: 'ADR-HR-CDAL'
        description:
          type: string
          maxLength: 2200
          example: 'Amazing anchorage with crystal clear water'
        locationName:
          type: string
          maxLength: 255
          example: 'Hvar'
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        mediaIds:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
        taggedUserIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid

    CreateFoodPost:
      type: object
      description: Create a recommended food spots post (evergreen)
      required: [type, regionCode, description, locationName, coordinates]
      properties:
        type:
          type: string
          enum: [food]
        regionCode:
          type: string
          maxLength: 50
          example: 'ADR-HR-CDAL'
        description:
          type: string
          maxLength: 2200
          example: 'Best fresh seafood in the spot area'
        locationName:
          type: string
          maxLength: 255
          example: 'Konoba Menego, Hvar'
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        mediaIds:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
        taggedUserIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid

    CreateSpotPost:
      type: object
      description: Create a recommended marinas post (evergreen)
      required: [type, regionCode, description, locationName, coordinates]
      properties:
        type:
          type: string
          enum: [marina]
        regionCode:
          type: string
          maxLength: 50
          example: 'ADR-HR-CDAL'
        description:
          type: string
          maxLength: 2200
          example: 'Excellent facilities, friendly staff, good prices'
        locationName:
          type: string
          maxLength: 255
          example: 'ACI Marina Palmizana'
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        mediaIds:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
        taggedUserIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid

    CreateTipsPost:
      type: object
      description: Create a tips and experience post (evergreen)
      required: [type, regionCode, description]
      properties:
        type:
          type: string
          enum: [tips]
        regionCode:
          type: string
          maxLength: 50
          example: 'ADR-HR'
        description:
          type: string
          maxLength: 2200
          example: 'When entering the port, watch for the unmarked shallow area on the starboard side'
