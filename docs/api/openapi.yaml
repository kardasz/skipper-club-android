        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                missingContentText:
                  value:
                    type: /errors/validation
                    title: Validation Failed
                    status: 422
                    detail: The request contains invalid data
                    violations:
                      - propertyPath: content.text
                        message: content.text should not be empty
                emptyContentText:
                  value:
                    type: /errors/validation
                    title: Validation Failed
                    status: 422
                    detail: The request contains invalid data
                    violations:
                      - propertyPath: content.text
                        message: content.text must be longer than or equal to 1 characters
                contentTextTooLong:
                  value:
                    type: /errors/validation
                    title: Validation Failed
                    status: 422
                    detail: The request contains invalid data
                    violations:
                      - propertyPath: content.text
                        message: content.text must be shorter than or equal to 2200 characters
                unknownContentKey:
                  value:
                    type: /errors/validation
                    title: Validation Failed
                    status: 422
                    detail: The request contains invalid data
                    violations:
                      - propertyPath: content.foo
                        message: property foo should not exist
                routeAlertExclusive:
                  value:
                    type: /errors/validation
                    title: Validation Failed
                    status: 422
                    detail: The request contains invalid data
                    violations:
                      - propertyPath: content
                        message: route and alert content cannot be combined
                tooManyMediaIds:
                  value:
                    type: /errors/validation
                    title: Validation Failed
                    status: 422
                    detail: The request contains invalid data
                    violations:
                      - propertyPath: mediaIds
                        message: mediaIds must contain no more than 10 elements
                invalidMediaIdFormat:
                  value:
                    type: /errors/validation
                    title: Validation Failed
                    status: 422
                    detail: The request contains invalid data
                    violations:
                      - propertyPath: mediaIds.0
                        message: each value in mediaIds must be a UUID
                locationNameTooLong:
                  value:
                    type: /errors/validation
                    title: Validation Failed
                    status: 422
                    detail: The request contains invalid data
                    violations:
                      - propertyPath: location.name
                        message: location.name must be shorter than or equal to 255 characters
                tooManyTaggedUsers:
                  value:
                    type: /errors/validation
                    title: Validation Failed
                    status: 422
                    detail: The request contains invalid data
                    violations:
                      - propertyPath: taggedUserIds
                        message: taggedUserIds must contain no more than 20 elements
                invalidTaggedUserIdFormat:
                  value:
                    type: /errors/validation
                    title: Validation Failed
                    status: 422
                    detail: The request contains invalid data
                    violations:
                      - propertyPath: taggedUserIds.0
                        message: each value in taggedUserIds must be a UUID
