          type: integer
          example: 0

    UserReviewsList:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        averageRatings:
          $ref: '#/components/schemas/ReviewRatings'
        total:
          type: integer
          description: Total number of published reviews for the user
          example: 15
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    Profile:
      allOf:
        - $ref: '#/components/schemas/UserDetail'
        - type: object
          properties:
            email:
              type: string
              format: email
              example: 'jan.kowalski@email.com'

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 identifier for the session
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: JWT refresh token
        user:
          $ref: '#/components/schemas/SessionUser'
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
          example: 900

    SessionUser:
      type: object
      description: User information included in session response
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 identifier
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        name:
          type: string
          description: Full name of the user
          example: 'Jan Kowalski'
        email:
          type: string
          format: email
          description: User's email address
          example: 'jan.kowalski@email.com'
        role:
          type: string
          enum: [user, admin]
          description: User's role in the system
          example: 'user'
        avatarUrl:
          type:
            - string
            - 'null'
          format: uri
          description: URL to the user's avatar image
          example: 'https://cdn.skipperclub.com/avatars/user-123.jpg'
      required:
        - id
        - name
        - email
        - role

    Cruise:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 identifier
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        title:
          type: string
          maxLength: 255
          description: Name/title of the cruise
          example: 'Weekend Baltic Adventure'
        description:
          type: string
          maxLength: 2000
          description: |
            Detailed description of the cruise. 
            Can contain hashtags (e.g., #sailing #baltic #weekend) 
            which will be automatically parsed and returned in hashtags array.
          example: 'Relaxing sailing cruise around the Baltic Sea with stops at beautiful coastal towns. Perfect for #sailing enthusiasts who love #baltic adventures and #weekend getaways.'
        hashtags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          description: |
            Hashtags automatically extracted from the description field.
            Read-only field populated by backend parsing.
            Hashtags are returned without the # symbol.
          example: ['sailing', 'baltic', 'weekend']
          readOnly: true
        departureDate:
          type: string
          format: date
          description: Start date of the cruise
          example: '2025-07-12'
        departurePort:
          $ref: '#/components/schemas/CruisePort'
          description: Start location/port for the cruise
        arrivalDate:
          type: string
          format: date
          description: End date of the cruise
          example: '2025-07-15'
        arrivalPort:
          $ref: '#/components/schemas/CruisePort'
          description: End location/port for the cruise
        stops:
          $ref: '#/components/schemas/CruiseStopSet'
        requiredSkills:
          type: string
          maxLength: 1000
          description: Required sailing skills or experience for participants
          example: 'Basic sailing knowledge required. Previous experience with larger boats preferred.'
        costPerPerson:
          type: number
          format: float
          minimum: 0
          description: Cost per person for the cruise
          example: 150.50
        currency:
          type: string
          description: Currency code for the cruise cost
          enum: [PLN, EUR, USD]
          example: 'PLN'
        maxParticipants:
          type: integer
          description: Maximum number of participants
        media:
          $ref: '#/components/schemas/MediaList'
        organizer:
          $ref: '#/components/schemas/User'
          description: Organizer of the cruise
        participants:
          type: array
          items:
            $ref: '#/components/schemas/User'
        participantsCount:
          type: integer
          description: Current number of participants
        private:
          type: boolean
          description: Whether the cruise is private or public
        vessel:
          type: string
          maxLength: 255
          description: |
            Complete vessel description including brand, model, name, year and any additional details.
            Since other vessel fields are optional, this field can contain comprehensive information.
            Backend will attempt to parse and populate other fields automatically when possible.

            Examples:
            - "Dufour 41 \"No Worries\" 2024"
            - "Beneteau Oceanis 51.1 \"Jupiter\" (2019)"
            - "Lagoon 42 catamaran \"Freedom\""
            - "Custom sailing yacht \"Midnight Sun\""
          example: 'Dufour 41 "No Worries" 2024'
        vesselBrand:
          type: string
          maxLength: 100
          description: Vessel manufacturer/brand name
          example: 'Dufour'
        vesselCabins:
          type: integer
          minimum: 1
          maximum: 20
          description: Number of cabins available for guests
          example: 3
        vesselLength:
          type: number
          format: float
          minimum: 15
          maximum: 200
          description: Vessel length in feet
          example: 41.0
        vesselModel:
          type: string
          maxLength: 100
          description: Vessel model name/number
          example: '41'
        vesselType:
          $ref: '#/components/schemas/VesselType'
          description: Type of vessel
          example: 'SAILING_YACHT'
        vesselYear:
          type: integer
          minimum: 1950
          maximum: 2030
          description: Year the vessel was built
          example: 2024
        type:
          $ref: '#/components/schemas/CruiseType'
        smokingAllowed:
          type: ['boolean', 'null']
          description: Whether smoking is allowed on the cruise (true = allowed, false = forbidden, null = unspecified)
          example: false
        alcoholAllowed:
          type: ['boolean', 'null']
          description: Whether alcohol is allowed on the cruise (true = allowed, false = forbidden, null = unspecified)
          example: true
        petsAllowed:
          type: ['boolean', 'null']
          description: Whether pets are allowed on the cruise (true = allowed, false = forbidden, null = unspecified)
          example: false
        childrenAllowed:
          type: ['boolean', 'null']
          description: Whether children are allowed on the cruise (true = allowed, false = forbidden, null = unspecified)
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        region:
          $ref: '#/components/schemas/CruiseRegion'

    CruiseWithUserContext:
      allOf:
        - $ref: '#/components/schemas/Cruise'
        - type: object
          properties:
            currentUserRole:
              type: string
              enum: [participant, organizer, none]
              description: Role of the current user in the cruise
            currentUserParticipation:
              $ref: '#/components/schemas/CruiseParticipant'
              description: Current user's participation in this cruise

