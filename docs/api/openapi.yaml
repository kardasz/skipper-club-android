  /posts/{postId}:
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post (only author)
      description: |
        Soft delete a post. Only the author can perform this operation.
        Sets the post status to `deleted` and records `deletedAt` timestamp.

        Soft delete is allowed from any non-deleted status: published, archived, expired, or resolved.
        After deletion, the post returns 404 for all subsequent API requests, including for the author.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Post deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Post not found
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PostsProblem'
              examples:
                postNotFound:
                  value:
                    type: '/errors/post-not-found'
                    title: 'Post Not Found'
                    status: 404
                    detail: 'The requested post could not be found'

    get:
      operationId: getPost
      tags: [posts]
      summary: Get post details
