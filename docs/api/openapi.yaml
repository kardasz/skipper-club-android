            - type: 'null'
          description: Height in pixels
          example: 1080
        mimetype:
          type: string
          description: MIME type of the media file
          enum:
            - image/jpeg
            - image/png
            - image/heic
            - video/mp4
          example: image/jpeg
    MediaList:
      type: array
      description: Array of media objects
      items:
        $ref: '#/components/schemas/Media'
    MediaSet:
      type: array
      description: Array of media file UUIDs
      minItems: 1
      maxItems: 10
      uniqueItems: true
      items:
        type: string
        format: uuid
        description: UUID v7 identifier of a media file
      example:
        - 018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e
        - 018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2f
    PreSignedUrlRequest:
      type: object
      required:
        - fileName
        - fileType
        - fileSize
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the file to upload
          example: vacation-photo.jpg
        fileType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/heic
            - video/mp4
          description: MIME type of the file
          example: image/jpeg
        fileSize:
          type: integer
          minimum: 1
          maximum: 52428800
          description: Size of the file in bytes (max 10MB for images, 50MB for videos)
          example: 1048576
        width:
          type: integer
          minimum: 1
          description: Width of the image/video in pixels
          example: 1920
        height:
          type: integer
          minimum: 1
          description: Height of the image/video in pixels
          example: 1080
        duration:
          type: number
          minimum: 0
          description: Duration of the video in seconds
          example: 30.5
        camera:
          type: string
          description: Camera model or device used to capture the media
          example: iPhone 15 Pro
        frameRate:
          type: number
          format: decimal
          minimum: 0
          maximum: 999.99
          description: Frame rate of the video (frames per second)
          example: 30
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude coordinate where the media was captured
          example: 54.352
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude coordinate where the media was captured
          example: 18.6466
        orientation:
          type: integer
          minimum: 1
          maximum: 8
          description: EXIF orientation value (1-8)
          example: 1
        dateTaken:
          type: string
          format: date-time
          description: Date and time when the media was captured (ISO 8601 format)
          example: '2024-07-28T15:30:00Z'
        metadata:
          type: object
          description: Additional metadata about the media file
          additionalProperties: true
          example:
            iso: 100
            aperture: f/2.8
            shutterSpeed: 1/1000
            gpsAltitude: 10.5
    PreSignedUrlResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          format: uri
          description: Presigned URL for uploading the file
          example: https://uploads.skipperclub.com/presigned-upload-url
        mediaId:
          type: string
          format: uuid
          description: UUID v7 identifier for the media record
          example: 018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e
        publicUrl:
          type: string
          format: uri
          description: Public URL where the file will be accessible after upload
          example: https://cdn.skipperclub.com/media/018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e
    TranscriptionResponse:
      type: object
      required:
