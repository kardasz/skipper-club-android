      tags:
        - notifications
      summary: Perform bulk actions on notifications (delete or mark as read)
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationActionsRequest'
      responses:
        '204':
          description: Action performed successfully
        '400':
          description: Invalid bulk action parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotificationsProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No matching notifications found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotificationsProblem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /notifications/{notificationId}:
    patch:
      operationId: updateNotification
      tags:
        - notifications
      summary: Update a notification (e.g., mark as read)
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Notification UUID v7
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationRequest'
      responses:
        '204':
          description: Notification updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Notification not found or not owned by the user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotificationsProblem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteNotification
      tags:
        - notifications
      summary: Delete a single notification (soft delete)
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Notification UUID v7
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Notification deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Notification not found or not owned by the user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotificationsProblem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /push/tokens:
    post:
      operationId: registerPushToken
      tags:
        - push
      summary: Register or refresh push token for current user
      description: |
        Upserts a push token by `(userId, deviceId)`. If the same token is currently
        assigned to another user, ownership is rebound to the current user.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRegisterRequest'
      responses:
        '204':
          description: Push token registered or refreshed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /push/tokens/{deviceId}:
    delete:
      operationId: unregisterPushTokenByDevice
      tags:
        - push
      summary: Unregister push token by device ID
      description: Deactivates current user's token for a given device (idempotent).
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Token unregistered (idempotent)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /push/tokens/unregister:
    post:
      operationId: unregisterPushTokenByToken
      tags:
        - push
      summary: Unregister push token using platform + token
      description: |
        Optional safety endpoint when `deviceId` is unavailable.
        Returns 403 if the token belongs to another user.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenUnregisterRequest'
      responses:
        '204':
          description: Token unregistered (idempotent)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Push token belongs to another user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PushProblem'
              examples:
                pushTokenOwnershipForbidden:
                  value:
                    type: /errors/push-token-ownership-forbidden
                    title: Push Token Access Forbidden
                    status: 403
                    detail: You are not allowed to modify this push token
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CoordinatesResponse:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    PhoneContactResponse:
      type: object
      required:
        - id
        - label
        - phone
        - extension
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        label:
          type:
            - string
            - 'null'
        phone:
          type: string
        extension:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RadioChannelResponse:
      type: object
      required:
        - id
        - name
        - channelKind
        - vhfChannel
        - frequencyMhz
        - channelNormalized
        - isPrimary
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        channelKind:
          type: string
          enum:
            - vhf
            - mhz
        vhfChannel:
          type:
            - integer
            - 'null'
        frequencyMhz:
          type:
            - string
            - 'null'
        channelNormalized:
          type: string
        isPrimary:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SpotResponse:
      type: object
      required:
        - id
        - name
        - coordinates
        - phoneContacts
        - radioChannels
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        coordinates:
          $ref: '#/components/schemas/CoordinatesResponse'
        distanceMeters:
          type: number
          description: Present only when geo-radius search was used
        phoneContacts:
          type: array
          items:
            $ref: '#/components/schemas/PhoneContactResponse'
        radioChannels:
          type: array
          items:
            $ref: '#/components/schemas/RadioChannelResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SpotsListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SpotResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      required:
        - total
        - limit
        - offset
        - hasMore
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
    CreatePhoneContactRequest:
      type: object
      required:
        - phone
      properties:
        label:
          type: string
          maxLength: 100
        phone:
          type: string
          description: International phone number starting with +
        extension:
          type: string
          maxLength: 20
    CreateRadioChannelRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
        vhfChannel:
          type: integer
          minimum: 1
          maximum: 88
        frequencyMhz:
          type: number
        isPrimary:
          type: boolean
          default: false
    CreateSpotRequest:
      type: object
      required:
        - name
        - coordinates
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        coordinates:
          $ref: '#/components/schemas/CoordinatesResponse'
        phoneContacts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CreatePhoneContactRequest'
        radioChannels:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CreateRadioChannelRequest'
    UpdatePhoneContactRequest:
      type: object
      required:
        - contactId
      properties:
        contactId:
          type: string
          format: uuid
        label:
          type:
            - string
            - 'null'
        phone:
          type: string
        extension:
          type:
            - string
            - 'null'
    UpdateRadioChannelRequest:
      type: object
      required:
        - channelId
      properties:
        channelId:
          type: string
          format: uuid
        name:
          type: string
        vhfChannel:
          type: integer
        frequencyMhz:
          type: number
        isPrimary:
          type: boolean
    PhoneContactsUpdateRequest:
      type: object
      properties:
        create:
          type: array
          items:
            $ref: '#/components/schemas/CreatePhoneContactRequest'
        update:
          type: array
          items:
            $ref: '#/components/schemas/UpdatePhoneContactRequest'
        delete:
          type: array
          items:
            type: string
            format: uuid
    RadioChannelsUpdateRequest:
      type: object
      properties:
        create:
          type: array
          items:
            $ref: '#/components/schemas/CreateRadioChannelRequest'
        update:
          type: array
          items:
            $ref: '#/components/schemas/UpdateRadioChannelRequest'
        delete:
          type: array
          items:
            type: string
            format: uuid
    UpdateSpotAggregateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        coordinates:
          $ref: '#/components/schemas/CoordinatesResponse'
        phoneContacts:
          $ref: '#/components/schemas/PhoneContactsUpdateRequest'
        radioChannels:
          $ref: '#/components/schemas/RadioChannelsUpdateRequest'
    SpotChangeRequestStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - cancelled
    SpotChangeRequestType:
      type: string
      enum:
        - SPOT_CREATE
        - SPOT_UPDATE
        - SPOT_DELETE_REQUEST
        - PHONE_CONTACT_CREATE
        - PHONE_CONTACT_UPDATE
        - PHONE_CONTACT_DELETE_REQUEST
        - RADIO_CHANNEL_CREATE
        - RADIO_CHANNEL_UPDATE
        - RADIO_CHANNEL_DELETE_REQUEST
    SpotCreatePayload:
      type: object
      required:
        - name
        - coordinates
      properties:
        name:
          type: string
        coordinates:
          $ref: '#/components/schemas/CoordinatesResponse'
        phoneContacts:
          type: array
          items:
            $ref: '#/components/schemas/CreatePhoneContactRequest'
        radioChannels:
          type: array
          items:
            $ref: '#/components/schemas/CreateRadioChannelRequest'
    SpotUpdatePayload:
      type: object
      required:
        - spotId
      properties:
        spotId:
          type: string
          format: uuid
        name:
          type: string
        coordinates:
          $ref: '#/components/schemas/CoordinatesResponse'
    SpotDeleteRequestPayload:
      type: object
      required:
        - spotId
      properties:
        spotId:
          type: string
          format: uuid
    PhoneContactCreatePayload:
      type: object
      required:
        - spotId
        - phone
      properties:
        spotId:
          type: string
          format: uuid
        label:
          type: string
        phone:
          type: string
        extension:
          type: string
    PhoneContactUpdatePayload:
      type: object
      required:
        - spotId
        - contactId
      properties:
        spotId:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid
        label:
          type:
            - string
            - 'null'
        phone:
          type: string
        extension:
          type:
            - string
            - 'null'
    PhoneContactDeleteRequestPayload:
      type: object
      required:
        - spotId
        - contactId
      properties:
        spotId:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid
    RadioChannelCreatePayload:
      type: object
      required:
        - spotId
        - name
      properties:
        spotId:
          type: string
          format: uuid
        name:
          type: string
        vhfChannel:
          type: integer
        frequencyMhz:
          type: number
        isPrimary:
          type: boolean
    RadioChannelUpdatePayload:
      type: object
      required:
        - spotId
        - channelId
      properties:
        spotId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        name:
          type: string
        vhfChannel:
          type: integer
        frequencyMhz:
          type: number
        isPrimary:
          type: boolean
    RadioChannelDeleteRequestPayload:
      type: object
      required:
        - spotId
        - channelId
      properties:
        spotId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
    CreateSpotChangeRequestRequest:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          $ref: '#/components/schemas/SpotChangeRequestType'
        comment:
          type: string
          maxLength: 2000
          description: Required for delete-type requests
        payload:
          oneOf:
            - $ref: '#/components/schemas/SpotCreatePayload'
            - $ref: '#/components/schemas/SpotUpdatePayload'
            - $ref: '#/components/schemas/SpotDeleteRequestPayload'
            - $ref: '#/components/schemas/PhoneContactCreatePayload'
            - $ref: '#/components/schemas/PhoneContactUpdatePayload'
            - $ref: '#/components/schemas/PhoneContactDeleteRequestPayload'
            - $ref: '#/components/schemas/RadioChannelCreatePayload'
            - $ref: '#/components/schemas/RadioChannelUpdatePayload'
            - $ref: '#/components/schemas/RadioChannelDeleteRequestPayload'
    SpotChangeRequestResponse:
      type: object
      required:
        - id
        - type
        - status
        - comment
        - payload
        - requestedByUserId
        - reviewedByUserId
        - reviewedAt
        - rejectionReason
        - cancelledAt
        - createdAt
        - updatedAt
