      description: Returns messages from chat. If chat was previously deleted by user, history is not visible.
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
          description: Filter messages created from this date (inclusive)
          example: '2025-01-01'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of messages to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of messages to skip
        - name: read
          in: query
          required: false
          schema:
            type: boolean
          description: Filter messages by read status for current user
        - name: toDate
          in: query
          schema:
            type: string
            format: date
          description: Filter messages created until this date (inclusive)
          example: '2025-12-31'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/SortMessages'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesList'
        '404':
          description: Chat not found
          headers:
