              type: string
              example: 'Gdańsk'
              description: Optional. User's city.
            country:
              type: string
              description: ISO 3166-1 alpha-2 country code
              example: 'PL'
            cruisesCount:
              type: integer
              example: 7
              description: Number of cruises the user participated in or created.
            currentUserFriendshipStatus:
              $ref: '#/components/schemas/FriendshipStatus'
              description: Friendship status between current user and this user
            facebookUrl:
              type: string
              format: uri
              maxLength: 200
              pattern: "^https?://(www\\.)?(facebook\\.com|fb\\.com)/.+$"
              description: Facebook profile URL
              example: 'https://facebook.com/jan.skipper'
            friendsCount:
              type: integer
              example: 42
            instagramUsername:
              type: string
              maxLength: 100
              pattern: '^@[a-zA-Z0-9_.]{1,30}$'
              description: Instagram username with @ prefix
              example: '@jan_skipper'
            postsCount:
              type: integer
              example: 156
            sailingExperience:
              type: string
              enum: [beginner, intermediate, advanced, professional]
