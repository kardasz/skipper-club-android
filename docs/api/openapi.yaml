          description: Change request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotChangeRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflict (duplicate target)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listSpotChangeRequests
      tags:
        - spots
      summary: List spot change requests
      description: >
        - Regular users only see their own requests.

        - Admins see all pending requests by default; use `scope=mine` to filter to own, or `status`
        to see other states.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SpotChangeRequestStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/SpotChangeRequestType'
        - name: requestedByUserId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by requesting user (admin only)
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - mine
              - all
          description: Admin-only scope override (default all)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Paginated list of change requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotChangeRequestsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: batchTransitionSpotChangeRequests
      tags:
        - spots
      summary: Batch approve, reject, or cancel change requests
      description: >
        Processes each ID independently in its own transaction. Always returns `200 OK`; per-item
        errors are embedded in `data[].error`.


        - `approve` / `reject`: admin only

        - `cancel`: the requesting user may cancel their own pending request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTransitionChangeRequestsRequest'
      responses:
        '200':
          description: Batch result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTransitionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Non-admin user tried to approve/reject
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
