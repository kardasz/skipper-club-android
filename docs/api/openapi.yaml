                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'email'
                        message: 'email is required'
                invalidEmailFormat:
                  value:
                    type: '/errors/validation'
                    title: 'Validation Failed'
                    status: 422
                    detail: 'The request contains invalid data'
                    violations:
                      - propertyPath: 'email'
                        message: 'email must be a valid email address'
        '403':
          description: CAPTCHA verification failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthProblem'
              examples:
                tokenMissing:
                  value:
                    type: '/errors/captcha-token-missing'
                    title: 'CAPTCHA Token Required'
                    status: 403
                    detail: 'A CAPTCHA verification token is required'
                verificationFailed:
                  value:
                    type: '/errors/captcha-verification-failed'
                    title: 'CAPTCHA Verification Failed'
                    status: 403
                    detail: 'The CAPTCHA verification failed. Please try again.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: CAPTCHA service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AuthProblem'
