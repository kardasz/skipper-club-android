            minimum: -90
            maximum: 90
          description: Radius mode latitude.
        - name: lng
          in: query
          required: false
          schema:
            type: number
            minimum: -180
            maximum: 180
          description: Radius mode longitude.
        - name: distance
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: >-
            Radius in kilometers. A post matches if its representative point is within the
            radius, OR if it carries a `location.area` (area-based alert) whose geometry comes
            within the radius of the center — so an area alert covering the requester's position
            is visible even when its representative point itself falls outside the radius.
            Distance sorting and clustering stay anchored on the representative point.
        - name: types
          in: query
          required: false
          schema:
            type: string
            example: post,spot,check_in
          description: CSV subset of post, spot, check_in.
        - name: postContains
          in: query
          required: false
          schema:
            type: string
            example: alert,media
          description: CSV of alert, media, route, note for post items.
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
          description: Post published-from filter.
        - name: toDate
          in: query
          required: false
          schema:
            type: string
          description: Post published-to filter.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Maximum returned items/clusters.
        - name: detail
          in: query
          required: false
          schema:
            type: string
            enum:
              - markers
              - summary
              - auto
          description: Detail level.
      responses:
        '200':
          description: Map items and clusters
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=15
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapItemsResponse'
        '400':
          description: Detail=markers cannot be satisfied even after coarsest clustering.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
              examples:
                markersNotSatisfiable:
                  value:
                    type: /errors/markers-detail-not-satisfiable
                    title: Markers Detail Not Satisfiable
                    status: 400
                    detail: >-
                      detail=markers cannot be satisfied for the requested area even after coarsest
                      clustering.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Validation error specific to map filtering.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
              examples:
                invalidSpatialMode:
                  value:
                    type: /errors/invalid-spatial-mode
                    title: Invalid Spatial Mode
                    status: 422
                    detail: >-
                      Provide either viewport bounds or center+radius — not both, neither, or
                      partial.
                spatialBoundsOutOfRange:
                  value:
                    type: /errors/spatial-bounds-out-of-range
                    title: Spatial Bounds Out Of Range
                    status: 422
                    detail: Viewport latitudinal span exceeds 120°.
                invalidCoordinateRange:
                  value:
                    type: /errors/invalid-coordinate-range
                    title: Invalid Coordinate Range
                    status: 422
                    detail: north must be strictly greater than south.
                invalidTypes:
                  value:
                    type: /errors/invalid-types
                    title: Invalid Types
                    status: 422
                    detail: 'types must be a non-empty subset of: post, spot, check_in.'
                invalidDateRange:
                  value:
                    type: /errors/invalid-date-range
                    title: Invalid Date Range
                    status: 422
                    detail: fromDate must be on or before toDate.
                invalidLimit:
                  value:
                    type: /errors/invalid-limit
                    title: Invalid Limit
                    status: 422
                    detail: limit must be an integer in [1, 500].
                invalidDetail:
                  value:
                    type: /errors/invalid-detail
                    title: Invalid Detail Level
                    status: 422
                    detail: 'detail must be one of: auto, markers, summary.'
                invalidPostContains:
                  value:
                    type: /errors/invalid-post-contains
                    title: Invalid Post Contains
                    status: 422
                    detail: contains contains one or more unknown content filter values.
  /check-ins:
    put:
      operationId: upsertCheckIn
      tags:
        - check-ins
      summary: Create or replace the current user's check-in
      description: |
        Stores exactly one latest check-in per user. Each call replaces the previous location.
        `checkedInAt` is set by the server at write time.

        When `locationName` is omitted, the API attempts reverse geocoding (see `Accept-Language`).
        If geocoding is unavailable, coordinates are still saved and `locationName` may be null.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInUpsertRequest'
      responses:
        '200':
          description: Current check-in after upsert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listCheckIns
      tags:
        - check-ins
      summary: List nearby active check-ins
      description: >
        Returns active check-ins within `distance` of the search center, sorted by distance
        ascending.

        Only non-stale check-ins are returned (default freshness window 24 hours, configurable via
        `CHECK_IN_FRESHNESS_TTL_HOURS`).

        The current user is included when their check-in falls within the radius.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
          description: Search center latitude (WGS84)
        - name: lng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
          description: Search center longitude (WGS84)
        - name: distance
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
          description: Search radius in kilometers (converted to meters for PostGIS)
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Page size
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Pagination offset
      responses:
        '200':
          description: Paginated list of check-ins with distance from search center
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
