  /spots:
    get:
      operationId: listSpots
      tags: [spots]
      summary: List spots
      description: |
        Returns a paginated list of active (non-deleted) spots. Supports optional filtering by name (ILIKE) and geo-radius. When `lat`, `lng`, and `distance` are all provided, results are sorted by distance ascending and include `distanceMeters`. Otherwise results are sorted alphabetically by name.
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: query
          schema:
            type: string
            maxLength: 255
          description: Partial name filter (case-insensitive)
        - name: lat
          in: query
          schema:
            type: number
            minimum: -90
            maximum: 90
          description: Latitude for geo-radius search (requires lng and distance)
        - name: lng
          in: query
          schema:
            type: number
            minimum: -180
            maximum: 180
          description: Longitude for geo-radius search (requires lat and distance)
        - name: distance
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
          description: Search radius in kilometers (requires lat and lng)
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Paginated list of spots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      operationId: adminCreateSpot
      tags: [spots]
      summary: Create a spot (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpotRequest'
      responses:
        '201':
          description: Spot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate spot (same name or physically nearby location)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SpotDuplicateProblem'
              example:
                type: /errors/spot-duplicate
                title: Spot Duplicate
                status: 409
                detail: A spot with the same name or at a nearby location already exists
                nearbySpots:
                  - id: 019dfd19-ddd8-7d23-a1f4-06b96c16a36d
                    name: Sopot Marina
                    coordinates:
                      lat: 54.441
                      lng: 18.567
                    distanceMeters: 87
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /spots/{id}:
    get:
      operationId: getSpot
      tags: [spots]
      summary: Get a single spot by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Spot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Spot not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
              examples:
                spotNotFound:
                  value:
                    type: /errors/spot-not-found
                    title: Spot Not Found
                    status: 404
                    detail: The requested spot could not be found
    patch:
      operationId: adminUpdateSpotAggregate
      tags: [spots]
      summary: Update spot aggregate (admin only)
      description: |
        Updates a spot and its phone contacts and radio channels. Changes are applied atomically. Only admin users may call this endpoint.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpotAggregateRequest'
      responses:
        '200':
          description: Updated spot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Spot not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '409':
          description: Conflict (duplicate spot, contact, channel, or primary channel)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SpotDuplicateProblem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: adminDeleteSpot
      tags: [spots]
