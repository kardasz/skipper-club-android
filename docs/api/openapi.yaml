  /sailing-briefs:
    get:
      operationId: getSailingBrief
      tags:
        - sailing-brief
      summary: Get current sailing brief for coordinates
      description: >-
        Returns the current, non-expired sailing brief for the technical brief area matching the
        given coordinates (point-in-polygon lookup; boundary points match). "Current" means the
        newest brief for the matched area whose `expiresAt` is still in the future. If the matched
        area has no non-expired brief, the lookup walks up the parent area chain applying the same
        validity filter. An expired brief is never returned — if the whole chain only has expired
        briefs, the response is 404.
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
          description: Current latitude.
        - name: lng
          in: query
          required: true
          schema:
