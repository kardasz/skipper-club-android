        - webhooks
      summary: Handle Mailgun email events
      description: >
        Endpoint for receiving webhook events from Mailgun (delivered, opened, clicked, failed,
        etc.).

        Protected by HMAC-SHA256 signature verification.
      security: []
      requestBody:
        required: true
        content:
          application/json:
