        - rejected
        - canceled
      description: |
        Request state:
        - pending: User received request from another user (can accept/reject)
        - sent: User sent request to another user (can cancel)
        - accepted: Request confirmed
        - rejected: Request declined
        - canceled: Request canceled
      example: pending
    FriendshipStatus:
      type: string
      enum:
