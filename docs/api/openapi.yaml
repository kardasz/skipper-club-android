        languagesSpoken:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: '^[a-z]{2}$'
            minLength: 2
            maxLength: 2
          description: Languages spoken by the user (ISO 639-1 codes)
          example: ['pl', 'en', 'de']
        preferredVoyageStyles:
          type: array
          items:
            type: string
          description: User's preferred sailing/voyage styles
          example: ['coastal', 'offshore', 'racing']

    CruiseType:
      type: string
      enum:
        - BEGINNER_INTRO
        - TRAINING
        - MILEBUILDING
        - ADVANCED
        - SPORT_REGATTA
        - FAMILY
        - SINGLES
        - COUPLES
        - SENIORS
        - WOMEN_ONLY
        - MEN_ONLY
        - PARTY
        - RELAX
        - SURVIVAL
        - PHOTOGRAPHY
        - CULINARY
        - CULTURAL_HISTORICAL
        - EXPLORATION
      description: |
        General type/theme of the cruise:
        - BEGINNER_INTRO: Intro cruise for beginners, easy routes
        - TRAINING: Training cruise focused on maneuvers, navigation, and license exam preparation
        - MILEBUILDING: Mile-building cruise to collect sailing hours and experience
        - ADVANCED: Advanced cruise on more demanding waters, including night watches
        - SPORT_REGATTA: Sport/regatta cruise focused on racing and regatta training
        - FAMILY: Family cruise with children, calmer routes, extra attractions and care
        - SINGLES: Singles cruise focused on meeting new people and social integration
        - COUPLES: Couples cruise, more intimate with romantic and relaxing elements
        - SENIORS: Seniors cruise with milder conditions and relaxed sailing
        - WOMEN_ONLY: Women-only cruise (e.g. with a female skipper/instructor)
        - MEN_ONLY: Men-only cruise (e.g. with a male skipper/instructor)
        - PARTY: Party cruise with strong social aspect, music, and evening events
        - RELAX: Relax cruise with calm routes and many anchorage stops
        - SURVIVAL: Survival-style cruise with minimalism, crew work, and few marinas
        - PHOTOGRAPHY: Photography cruise focused on best photo spots and photo workshops
        - CULINARY: Culinary cruise with onboard cooking and local food tasting
        - CULTURAL_HISTORICAL: Cultural/historical cruise with visiting ports, cities, and museums
        - EXPLORATION: Exploration cruise visiting less-known islands and bays
      example: 'FAMILY'

    VesselType:
      type: string
      enum: [SAILING_YACHT, CATAMARAN, MOTORBOAT, TRIMARAN, GULET, SCHOONER]
      description: |
        Type of vessel:
        - SAILING_YACHT: Traditional sailing yacht (monohull)
        - CATAMARAN: Multi-hull sailing vessel with two hulls
        - MOTORBOAT: Motor-powered vessel
        - TRIMARAN: Multi-hull sailing vessel with three hulls
        - GULET: Traditional wooden sailing vessel (Mediterranean style)
        - SCHOONER: Large sailing vessel with multiple masts
      example: 'SAILING_YACHT'

    NotificationSettings:
      type: object
      required:
        - emailNotificationsEnabled
        - pushNotificationsEnabled
      properties:
        emailNotificationsEnabled:
          type: boolean
          description: Whether the user receives notification emails (e.g., review reminders). Does not affect transactional emails (login codes, invitations, account lifecycle).
          example: true
        pushNotificationsEnabled:
          type: boolean
          description: Whether the user receives push notifications via APNs/FCM. Does not affect WebSocket (in-app) notifications which are always delivered.
          example: true

    UpdateNotificationSettings:
      type: object
      required:
        - emailNotificationsEnabled
        - pushNotificationsEnabled
      properties:
        emailNotificationsEnabled:
          type: boolean
          description: Enable or disable notification emails.
          example: true
        pushNotificationsEnabled:
          type: boolean
          description: Enable or disable push notifications.
          example: true

    ValidationProblem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type
          example: '/errors/validation'
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: 'Validation Failed'
        status:
          type: integer
          description: The HTTP status code
          example: 422
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
          example: 'The request contains invalid data'
        violations:
          type: array
          description: |
            List of validation violations. Common examples include:
            - mediaRequiredForPhotoPost: mediaIds is required for photo type posts
            - descriptionRequiredForPostType: description is required for non-photo type posts
            - locationRequiredForPostType: locationName is required for place, food, spot, route posts
            - regionNotFound: Invalid or unknown region code
            - invalidCrossRegionType: crossRegionTypes must be evergreen types only
            - invalidPostStatus: deleted status is not allowed in filters
            - invalidSortField: sort field must be one of: createdAt, updatedAt
            - coordinatesRequiredForRoute: coordinates are required for route type posts
            - routeStopsRequired: at least one stop is required for route type posts
            - routeFieldsOnNonRoutePost: stops/durationDays/lengthNm only valid for route posts
            - statusFilterNotAllowedWithoutUserId: non-published status filters require userId
            - invalidReactionType: reactionType must be a valid enum value
          items:
            type: object
            required: [propertyPath, message]
            properties:
              propertyPath:
                type: string
                description: The property path that failed validation
                example: 'email'
              message:
                type: string
                description: The validation error message
                example: 'email must be a valid email address'

