      summary: Request password reset code
      description: |
        Sends a 6-digit password reset code to the user's email.
        Always returns 204 regardless of whether the email exists to prevent user enumeration.
        Rate limited to 3 requests per minute per IP and one outstanding code per user per 15 minutes.
      security: []
