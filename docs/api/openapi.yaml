    CruiseParticipantState:
      type: string
      enum:
        [
          pending,
          invited,
          accepted,
          rejected_by_participant,
          rejected_by_organizer,
          withdrawn_by_participant,
          withdrawn_by_organizer,
          canceled_by_participant,
          canceled_by_organizer,
        ]
      description: |
        State of the participant:
        - pending: User requests to join (organizer can accept/reject)
