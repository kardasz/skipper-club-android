          type: string
          minLength: 2
          maxLength: 100
          description: Vessel manufacturer/brand name
          example: 'Dufour'
        vesselCabins:
          type: integer
          minimum: 1
          maximum: 20
          description: Number of cabins available for guests
          example: 3
        vesselLength:
          type: number
          format: float
          minimum: 15
          maximum: 200
          description: Vessel length in feet
          example: 41.0
        vesselModel:
