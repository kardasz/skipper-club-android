    Media:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 identifier for the media file
          example: 018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e
        type:
          type: string
          enum:
            - image
            - video
          description: Media type
          example: image
        url:
          type: string
          format: uri
          description: URL of the media file
          example: https://cdn.skipperclub.com/posts/img-456.jpg
        width:
          anyOf:
            - type: integer
