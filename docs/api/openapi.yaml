  /posts:
    get:
      operationId: listPosts
      tags:
        - posts
      summary: Get post feed
      description: >-
        Returns the public feed. Filtering is based on contentKeys, location, search, hashtags,
        author, status, and publishedAt.
      parameters:
        - name: contains
          in: query
          required: false
          schema:
            type: string
            example: alert,media
          description: CSV of alert, media, route, note. note matches empty contentKeys.
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: >-
            Full-text search over post text, location, hashtags, route stops, and alert external
            number.
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FilterablePostStatus'
          description: Filter by status; non-public statuses are author-scoped.
        - name: userId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by author UUID v7.
        - name: locationName
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive location name substring.
        - name: hashtag
          in: query
          required: false
          schema:
            type: string
          description: 'Hashtag without #.'
        - name: lat
          in: query
          required: false
          schema:
            type: number
            minimum: -90
            maximum: 90
          description: Radius search latitude.
        - name: lng
          in: query
          required: false
          schema:
            type: number
            minimum: -180
            maximum: 180
          description: Radius search longitude.
        - name: distance
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Radius in kilometers.
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
          description: Published from date.
        - name: toDate
          in: query
          required: false
          schema:
            type: string
          description: Published to date.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Offset; used for distance sort and compatibility.
        - name: beforePublishedAt
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Keyset cursor timestamp for chronological feed.
        - name: beforeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Keyset cursor id for chronological feed.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - publishedAt
              - updatedAt
              - distance
            default: publishedAt
          description: Sort field.
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: Sort direction.
      responses:
        '200':
          description: Feed of posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostsList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: >
            Validation failed. Possible causes:

            - Invalid content filter

            - Invalid content filter

            - Invalid status filter (contains deleted, or non-published without
            userId=currentUserId)

            - Invalid date format (missing timezone)

            - Location parameters incomplete (lat, lng, distance must all be provided together)

            - sort=distance used without location parameters
          $ref: '#/components/responses/UnprocessableEntity'
