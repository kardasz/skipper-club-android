    UserDetail:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            bio:
              type: string
              example: Sailing enthusiast and Baltic Sea explorer
            city:
              type: string
              example: Gdańsk
              description: Optional. User's city.
            country:
              type: string
              description: ISO 3166-1 alpha-2 country code
              example: PL
            cruisesCount:
              type: integer
              example: 7
              description: Number of cruises the user participated in or created.
