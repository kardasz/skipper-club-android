        - rejected_by_organizer: Organizer rejected join request
        - withdrawn_by_participant: Participant withdrew join request
        - withdrawn_by_organizer: Organizer withdrew invitation
        - canceled_by_participant: Participant left cruise
        - canceled_by_organizer: Organizer removed participant
