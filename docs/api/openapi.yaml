        invalidCount:
          type: integer
          description: Number of report_invalid votes
          example: 1
        userVote:
          anyOf:
            - $ref: '#/components/schemas/ValidityVoteType'
            - type: 'null'
          description: Current user's vote (null if not voted)
          example: 'confirm'

