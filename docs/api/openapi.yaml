    PostsList:
      type: object
      description: Paginated list of posts using unified { data, meta } format
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        meta:
          $ref: '#/components/schemas/PageMeta'

    PostUpdate:
      type: object
      description: |
        Full update schema for PUT /posts/{postId}.
        Note: type is immutable and cannot be changed after creation.
        Route-specific fields (stops, durationDays, lengthNm) are only valid for route posts.
      required: [regionCode]
      properties:
        regionCode:
          type: string
          maxLength: 50
          description: Sailing region identifier
          example: 'ADR-HR-CDAL'
        status:
          $ref: '#/components/schemas/PostStatus'
          description: |
            Allowed transitions: published→archived, published→resolved.
            expired and resolved only valid for time-sensitive types.
        description:
          type: ['string', 'null']
          maxLength: 2200
          example: 'Updated description with more details'
        locationName:
          type: ['string', 'null']
          maxLength: 255
          example: 'Gulf of Gdańsk'
        coordinates:
          oneOf:
            - $ref: '#/components/schemas/Coordinates'
            - type: 'null'
        mediaIds:
          oneOf:
            - type: array
              maxItems: 10
              items:
                type: string
                format: uuid
            - type: 'null'
        taggedUserIds:
          oneOf:
            - type: array
              maxItems: 20
              items:
                type: string
                format: uuid
            - type: 'null'
        # Route-specific fields (flat, only valid for route posts)
        stops:
          oneOf:
            - type: array
              minItems: 1
              maxItems: 30
              items:
                $ref: '#/components/schemas/RouteStop'
            - type: 'null'
          description: Route waypoints. Only valid for route type posts.
        durationDays:
          type: ['integer', 'null']
          minimum: 1
          description: Duration in days. Only valid for route type posts.
        lengthNm:
          type: ['number', 'null']
          minimum: 0
          description: Length in nautical miles. Only valid for route type posts.

    PostPartialUpdate:
      type: object
      description: |
        Partial update schema for PATCH /posts/{postId}.
        Omitted fields are not modified. Fields set to null are cleared.
        Note: type is immutable and cannot be changed after creation.
        Route-specific fields (stops, durationDays, lengthNm) are only valid for route posts.
      properties:
        regionCode:
          type: string
          maxLength: 50
          description: Sailing region identifier
          example: 'ADR-HR-CDAL'
        status:
          $ref: '#/components/schemas/PostStatus'
          description: |
            Allowed transitions: published→archived, published→resolved.
            expired and resolved only valid for time-sensitive types.
        description:
          type: ['string', 'null']
          maxLength: 2200
          example: 'Updated description with more details'
        locationName:
          type: ['string', 'null']
          maxLength: 255
          example: 'Gulf of Gdańsk'
        coordinates:
          oneOf:
            - $ref: '#/components/schemas/Coordinates'
            - type: 'null'
        mediaIds:
          oneOf:
            - type: array
              maxItems: 10
              items:
                type: string
                format: uuid
            - type: 'null'
        taggedUserIds:
          oneOf:
            - type: array
              maxItems: 20
              items:
                type: string
                format: uuid
            - type: 'null'
        # Route-specific fields (flat, only valid for route posts)
        stops:
          oneOf:
            - type: array
              minItems: 1
              maxItems: 30
              items:
                $ref: '#/components/schemas/RouteStop'
            - type: 'null'
          description: Route waypoints. Only valid for route type posts.
        durationDays:
          type: ['integer', 'null']
          minimum: 1
          description: Duration in days. Only valid for route type posts.
        lengthNm:
          type: ['number', 'null']
          minimum: 0
          description: Length in nautical miles. Only valid for route type posts.

    ReactionSummary:
      type: object
      description: Summary of reactions on a post
      properties:
        total:
          type: integer
          description: Total number of reactions
          example: 25
        byType:
          type: object
          additionalProperties:
            type: integer
          description: Count per reaction type (only types with count > 0 are included)
          example:
            heart: 15
            anchor: 3
            sailboat: 7
        userReactions:
          type: array
          items:
            $ref: '#/components/schemas/ReactionType'
          description: Current user's reactions on this post
          example: ['heart', 'anchor']

    VoteSummary:
      type: object
