          format: date-time
          description: When the invitation expires
          example: '2025-01-25T10:30:00Z'
        createdAt:
          type: string
          format: date-time
          description: When the invitation was created
          example: '2025-01-18T10:30:00Z'
        inviter:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
              description: ID of the admin who sent the invitation
              example: '0192ee6e-7a6d-7c45-b0c2-3a5b4c6d7e8f'
            name:
              type: string
              description: Name of the admin who sent the invitation
              example: Admin User

    InvitationListResponse:
      type: object
      required: [invitations, total, limit, offset]
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        total:
          type: integer
          description: Total number of invitations matching the filter
          example: 42
        limit:
          type: integer
          description: Maximum number of results returned
          example: 20
        offset:
          type: integer
          description: Number of results skipped
          example: 0

    MailgunWebhookPayload:
      type: object
      description: Mailgun webhook event payload
      required:
        - signature
        - event-data
      properties:
        signature:
          type: object
          description: Signature data for webhook verification
          required:
            - timestamp
            - token
            - signature
          properties:
            timestamp:
              type: string
              description: Unix timestamp when the event was generated
              example: '1609459200'
            token:
              type: string
              description: Random string token
              example: '50b1c1e03b0fc1e5b1f0e1a8'
            signature:
              type: string
              description: HMAC-SHA256 signature (hex encoded)
              example: 'c5b7c8a8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6'
        event-data:
          type: object
          description: Event data
          required:
            - event
            - timestamp
          properties:
            event:
              type: string
              description: Event type
              enum:
                - delivered
                - opened
                - clicked
                - failed
                - complained
                - rejected
                - unsubscribed
              example: 'delivered'
            timestamp:
              type: number
              description: Unix timestamp of the event
              example: 1609459200
            recipient:
              type: string
              format: email
              description: Email address of the recipient
              example: 'user@example.com'
            message:
              type: object
              description: Message details
              properties:
                headers:
                  type: object
                  properties:
                    message-id:
                      type: string
                      description: Unique message identifier
                      example: '<abc123@mail.example.com>'
            severity:
              type: string
              description: Severity of failure (for failed events)
              enum:
                - permanent
                - temporary
              example: 'permanent'
            reason:
              type: string
              description: Reason for failure or rejection
              example: 'Mailbox does not exist'
            delivery-status:
              type: object
              description: Delivery status details
              properties:
                description:
                  type: string
                  description: Human-readable description of delivery status
                  example: 'Message was rejected'

    AwsSnsMessage:
      type: object
      description: AWS SNS message wrapper for SES notifications
      required:
        - Type
        - MessageId
        - TopicArn
        - Timestamp
        - SignatureVersion
        - Signature
        - SigningCertURL
      properties:
        Type:
          type: string
          description: Type of SNS message
          enum:
            [Notification, SubscriptionConfirmation, UnsubscribeConfirmation]
          example: 'Notification'
        MessageId:
          type: string
          description: Unique identifier for the SNS message
          example: '22b80b92-fdea-4c2c-8f9d-bdfb0c7bf324'
        Token:
          type: string
          description: Token for subscription confirmation (only for SubscriptionConfirmation)
          example: 'confirmation-token-xxx'
        TopicArn:
          type: string
          description: ARN of the SNS topic
          example: 'arn:aws:sns:us-east-1:123456789012:ses-notifications'
        Subject:
          type: string
          description: Optional subject line
          example: 'Amazon SES Email Event Notification'
        Message:
          type: string
          description: JSON string containing SES notification details
          example: '{"notificationType":"Delivery","mail":{...},"delivery":{...}}'
        Timestamp:
          type: string
          format: date-time
          description: Time the message was published
          example: '2024-01-15T12:00:02.000Z'
        SignatureVersion:
          type: string
          description: Version of the signature algorithm
          enum: ['1', '2']
          example: '1'
        Signature:
          type: string
          description: Base64-encoded signature of the message
          example: 'EXAMPLEpH+...'
        SigningCertURL:
          type: string
          format: uri
          description: URL to the certificate used to sign the message
          example: 'https://sns.us-east-1.amazonaws.com/SimpleNotificationService-xxx.pem'
        SubscribeURL:
          type: string
          format: uri
          description: URL to confirm subscription (only for SubscriptionConfirmation)
          example: 'https://sns.us-east-1.amazonaws.com/?Action=ConfirmSubscription&...'
        UnsubscribeURL:
          type: string
          format: uri
          description: URL to unsubscribe from the topic
          example: 'https://sns.us-east-1.amazonaws.com/?Action=Unsubscribe&...'

    SailingBriefResponse:
      type: object
      required:
        - id
        - regionCode
        - language
        - timeSlot
        - localDate
        - generatedAt
        - expiresAt
        - version
        - generationSource
        - shortDescription
        - fullDescription
        - weather
        - berth
        - route
        - tips
        - spot
        - food
        - place
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier (UUID v7)
          example: '018fa2e4-8e3b-7b2e-8e3b-7b2e8e3b7b2e'
        regionCode:
          type: string
          description: Region code
          example: 'HR'
        language:
          type: string
          enum: [en, pl]
          description: Language of the brief
          example: 'en'
        timeSlot:
          type: string
          enum: [morning, noon, evening]
          description: Time slot of the brief
          example: 'morning'
        localDate:
          type: string
          format: date
          description: Local date in region timezone
          example: '2026-02-11'
        generatedAt:
          type: string
          format: date-time
          description: Timestamp when brief was generated
          example: '2026-02-11T05:01:23Z'
        expiresAt:
          type: string
          format: date-time
          description: Timestamp when brief expires (informational)
          example: '2026-02-11T12:00:00+01:00'
        version:
          type: integer
          description: Version number for this time slot
          example: 1
        generationSource:
          type: string
          enum: [auto, manual, edited]
          description: How the brief was generated
          example: 'auto'
        shortDescription:
          type: string
          description: Brief overview with safety disclaimer (markdown)
          example: 'Excellent sailing conditions today. This briefing is informational only...'
        fullDescription:
          type: string
          description: Detailed description of sailing conditions (markdown)
          example: 'Detailed overview of current conditions...'
        weather:
          type: string
          description: Weather conditions and forecast (markdown)
          example: 'Sunny with light winds from NW...'
        berth:
          type: string
          description: Berth availability and conditions (markdown)
          example: 'Marina berths available in most ports...'
        route:
          type: string
          description: Recommended sailing routes (markdown)
          example: 'Popular routes: Split to Hvar...'
        tips:
          type: string
          description: Practical sailing tips (markdown)
          example: 'Check local weather before departure...'
        spot:
          type: string
          description: Marina facilities and information (markdown)
          example: 'ACI Marina facilities include...'
        food:
          type: string
          description: Dining options and recommendations (markdown)
          example: 'Local seafood restaurants...'
        place:
          type: string
          description: Interesting places and attractions (markdown)
          example: 'Visit the historic old town...'

    SailingBriefListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SailingBriefResponse'
        meta:
          type: object
          required:
            - total
            - limit
            - offset
          properties:
            total:
              type: integer
              description: Total number of briefs matching filters
              example: 42
            limit:
              type: integer
              description: Number of items per page
              example: 20
            offset:
              type: integer
              description: Number of items skipped
              example: 0

    SailingBriefProblem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          description: URI reference that identifies the problem type
          example: '/errors/sailing-brief-not-available'
        title:
          type: string
          description: Short, human-readable summary
          example: 'Sailing Brief Not Available'
        status:
          type: integer
          description: HTTP status code
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: 'No sailing brief has been generated yet for this region'

    AdminRegenerateRequest:
      type: object
      required:
        - regionCodes
        - prompt
      properties:
        regionCodes:
          type: array
          items:
            type: string
          minItems: 1
          description: Array of region codes to regenerate
          example: ['HR', 'GR']
        prompt:
          type: string
          description: Custom prompt for AI regeneration
          example: 'Focus on family-friendly activities and safety'

    AdminRegenerateResponse:
      type: object
      required:
        - jobs
      properties:
        jobs:
          type: array
          items:
            type: object
            required:
              - regionCode
              - language
              - timeSlot
            properties:
              regionCode:
                type: string
                example: 'HR'
              language:
                type: string
                example: 'en'
              timeSlot:
                type: string
                example: 'morning'
          description: List of enqueued regeneration jobs

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        example: 'pl,en;q=0.9'
      description: Preferred language for the response

    XTurnstileToken:
      name: X-Turnstile-Token
      in: header
      required: false
      description: |
        Cloudflare Turnstile CAPTCHA token. Required when CAPTCHA is enabled (TURNSTILE_SECRET_KEY is set).
        When the server has no secret key configured, CAPTCHA verification is disabled and this header is ignored.
      schema:
        type: string
        maxLength: 2048
        example: '0.abc123...'

    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: Sort order (ascending or descending)

    SortChats:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [createdAt, updatedAt, name]
        default: updatedAt
      description: Field to sort chats by

    SortComments:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [createdAt, updatedAt]
        default: createdAt
      description: Field to sort comments by

    SortCruiseParticipants:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [createdAt, updatedAt, state]
        default: createdAt
      description: Field to sort cruise participants by

    SortCruises:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          [
            createdAt,
            departureDate,
            title,
            costPerPerson,
            vesselLength,
            vesselType,
            vesselYear,
          ]
        default: departureDate
      description: Field to sort cruises by

    SortFriendRequests:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [createdAt, updatedAt, state]
        default: createdAt
      description: Field to sort friend requests by

    SortFriends:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [name, createdAt]
        default: name
      description: Field to sort friends by

    SortMessages:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [createdAt, updatedAt]
        default: createdAt
      description: Field to sort messages by

    SortPosts:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [createdAt, updatedAt, distance]
        default: createdAt
      description: |
        Field to sort posts by. Invalid values return 422.
        `distance` - Only valid when `lat`, `lng`, and `distance` parameters are provided. Returns 422 otherwise.

    SortUsers:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [name, createdAt]
        default: name
      description: Field to sort users by
  headers:
    X-RateLimit-Limit:
      description: The number of allowed requests in the current period
      schema:
        type: integer
        example: 1000
    X-RateLimit-Remaining:
      description: The number of requests left in the current period
      schema:
        type: integer
        example: 999
    X-RateLimit-Reset:
      description: The timestamp when the rate limit window resets (Unix timestamp)
      schema:
        type: integer
        example: 1642694400

  responses:
    BadRequest:
      description: Bad request
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            default:
              value:
                type: '/errors/validation'
                title: 'Bad Request'
                status: 400
                detail: 'Request payload is malformed or unreadable'

    Forbidden:
      description: Access denied
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AuthProblem'
          examples:
            sessionAccessForbidden:
              value:
                type: '/errors/session-access-forbidden'
                title: 'Session Access Forbidden'
                status: 403
                detail: 'You are not allowed to access this session'
            forbiddenRole:
              value:
                type: '/errors/forbidden-role'
                title: 'Forbidden'
                status: 403
                detail: 'You do not have permission to perform this action'

    NotFound:
      description: Resource not found
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            default:
              value:
                type: '/errors/not-found'
                title: 'Resource Not Found'
                status: 404
                detail: 'The requested resource could not be found'

    Unauthorized:
      description: Authentication error or invalid token
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AuthProblem'
          examples:
            invalidCredentials:
              value:
                type: '/errors/invalid-credentials'
                title: 'Invalid Credentials'
                status: 401
                detail: 'The provided email or password is incorrect'
            invalidRefreshToken:
              value:
                type: '/errors/invalid-refresh-token'
                title: 'Invalid Refresh Token'
                status: 401
                detail: 'The provided refresh token is invalid or does not match the session'
            refreshTokenExpired:
              value:
                type: '/errors/refresh-token-expired'
                title: 'Refresh Token Expired'
                status: 401
                detail: 'The refresh token has expired and a new login is required'
            invalidSession:
              value:
                type: '/errors/invalid-session'
                title: 'Invalid Session'
                status: 401
                detail: 'The session is invalid or has been terminated'
            authenticationRequired:
              value:
                type: '/errors/authentication-required'
                title: 'Authentication Required'
                status: 401
                detail: 'Authentication is required to access this resource'

    UnprocessableEntity:
      description: The request was well-formed but contains semantic errors
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            default:
              value:
                type: '/errors/validation'
                title: 'Validation Failed'
                status: 422
                detail: 'The request contains semantic errors'
                violations:
                  - propertyPath: 'departureDate'
                    message: 'Departure date must be before arrival date'
                  - propertyPath: 'maxParticipants'
                    message: 'Maximum participants cannot exceed 20 for this cruise type'

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        Retry-After:
          description: Number of seconds to wait before retrying
          schema:
            type: integer
            example: 60
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AuthProblem'
          examples:
            rateLimitExceeded:
              value:
                type: '/errors/otp-rate-limit'
                title: 'Rate Limit Exceeded'
                status: 429
                detail: 'Too many requests. Please try again later.'
