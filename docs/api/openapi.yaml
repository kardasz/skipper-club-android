        - MessageId
        - TopicArn
        - Timestamp
        - SignatureVersion
        - Signature
        - SigningCertURL
      properties:
        Type:
          type: string
          description: Type of SNS message
          enum:
            - Notification
            - SubscriptionConfirmation
            - UnsubscribeConfirmation
          example: Notification
        MessageId:
          type: string
          description: Unique identifier for the SNS message
          example: 22b80b92-fdea-4c2c-8f9d-bdfb0c7bf324
        Token:
          type: string
          description: Token for subscription confirmation (only for SubscriptionConfirmation)
          example: confirmation-token-xxx
        TopicArn:
          type: string
          description: ARN of the SNS topic
          example: arn:aws:sns:us-east-1:123456789012:ses-notifications
        Subject:
          type: string
          description: Optional subject line
          example: Amazon SES Email Event Notification
        Message:
          type: string
          description: JSON string containing SES notification details
          example: '{"notificationType":"Delivery","mail":{...},"delivery":{...}}'
        Timestamp:
          type: string
          format: date-time
          description: Time the message was published
          example: '2024-01-15T12:00:02.000Z'
        SignatureVersion:
          type: string
          description: Version of the signature algorithm
          enum:
            - '1'
            - '2'
          example: '1'
        Signature:
          type: string
          description: Base64-encoded signature of the message
          example: EXAMPLEpH+...
        SigningCertURL:
          type: string
          format: uri
          description: URL to the certificate used to sign the message
          example: https://sns.us-east-1.amazonaws.com/SimpleNotificationService-xxx.pem
        SubscribeURL:
          type: string
          format: uri
          description: URL to confirm subscription (only for SubscriptionConfirmation)
          example: https://sns.us-east-1.amazonaws.com/?Action=ConfirmSubscription&...
        UnsubscribeURL:
          type: string
          format: uri
          description: URL to unsubscribe from the topic
          example: https://sns.us-east-1.amazonaws.com/?Action=Unsubscribe&...
    SailingBriefResponse:
      type: object
      required:
        - id
        - area
        - language
        - timeSlot
        - localDate
        - generatedAt
        - expiresAt
        - content
      properties:
        id:
          type: string
          format: uuid
        area:
          $ref: '#/components/schemas/SailingBriefArea'
        language:
          type: string
        timeSlot:
          type: string
          enum:
            - morning
            - noon
            - evening
        localDate:
          type: string
          format: date
        generatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        content:
          $ref: '#/components/schemas/SailingBriefContent'
    SailingBriefListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SailingBriefResponse'
        meta:
          type: object
          required:
            - total
            - limit
            - offset
          properties:
            total:
              type: integer
              description: Total number of briefs matching filters
              example: 42
            limit:
              type: integer
              description: Number of items per page
              example: 20
            offset:
              type: integer
              description: Number of items skipped
              example: 0
    SailingBriefProblem:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: URI reference that identifies the problem type
          example: /errors/sailing-brief-not-available
        title:
          type: string
          description: Short, human-readable summary
          example: Sailing Brief Not Available
        status:
          type: integer
          description: HTTP status code
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: No current sailing brief is available for this location
    AdminRegenerateRequest:
      type: object
      required:
        - areaCodes
        - prompt
      properties:
        prompt:
          type: string
          description: Custom prompt for AI regeneration
          example: Focus on family-friendly activities and safety
        areaCodes:
          type: array
          items:
            type: string
          minItems: 1
          description: Technical brief area codes to regenerate
          example:
            - HR-DALMATIA-CENTRAL-03
    AdminRegenerateResponse:
      type: object
      required:
        - jobs
      properties:
        jobs:
          type: array
          items:
            type: object
            required:
              - areaCode
              - language
              - timeSlot
            properties:
              language:
                type: string
                example: en
              timeSlot:
                type: string
                example: morning
              areaCode:
                type: string
                example: HR-DALMATIA-CENTRAL-03
          description: List of enqueued regeneration jobs
    PostContentRoute:
      type: object
      required:
        - stops
      properties:
        stops:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required:
              - name
              - coordinates
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 255
              coordinates:
                type: object
                required:
                  - lat
                  - lng
                properties:
                  lat:
                    type: number
                    minimum: -90
                    maximum: 90
                  lng:
                    type: number
                    minimum: -180
                    maximum: 180
        durationDays:
          type: integer
          minimum: 1
        lengthNm:
          type: number
          minimum: 0
      additionalProperties: false
    PostContentAlertInput:
      type: object
      required:
        - category
      properties:
        category:
          $ref: '#/components/schemas/AlertCategory'
        severity:
          type: string
          enum:
            - info
            - warning
            - critical
      additionalProperties: false
    PostContentAlert:
      allOf:
        - $ref: '#/components/schemas/PostContentAlertInput'
        - type: object
          properties:
            language:
              type: string
            source:
              type: string
            externalNumber:
              type: string
            externalPublishedAt:
              type: string
              format: date-time
            externalUpdatedAt:
              type: string
              format: date-time
            externalExpiresAt:
              type: string
              format: date-time
            cancellation:
              type: object
              properties:
                cancelledExternalNumber:
                  type: string
                cancelledAlertId:
                  type:
                    - string
                    - 'null'
                  format: uuid
    PostContent:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2200
        route:
          $ref: '#/components/schemas/PostContentRoute'
        alert:
          $ref: '#/components/schemas/PostContentAlert'
      additionalProperties: false
    PostContentInput:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2200
        route:
          $ref: '#/components/schemas/PostContentRoute'
        alert:
          $ref: '#/components/schemas/PostContentAlertInput'
      additionalProperties: false
    PostLocationInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        point:
          type: object
          required:
            - lat
            - lng
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lng:
              type: number
              minimum: -180
              maximum: 180
        area:
          type: object
          description: GeoJSON Polygon or MultiPolygon; allowed only for alert posts.
      additionalProperties: false
    PostLocation:
      type: object
      required:
        - name
        - point
        - area
      properties:
        name:
          type:
            - string
            - 'null'
        point:
          anyOf:
            - type: object
              required:
                - lat
                - lng
              properties:
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
            - type: 'null'
        area:
          type:
            - object
            - 'null'
          description: GeoJSON Polygon or MultiPolygon.
    PostMedia:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        type:
          type: string
        orderIndex:
          type: integer
        width:
          type:
            - integer
            - 'null'
        height:
          type:
            - integer
            - 'null'
        size:
          type:
            - integer
            - 'null'
        status:
          type: string
    PostSource:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - alert
        id:
          type: string
          format: uuid
    SailingBriefArea:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    SailingBriefContent:
      type: object
      required:
        - shortDescription
        - fullDescription
        - weather
        - berth
        - route
        - tips
        - marina
        - food
        - place
      properties:
        shortDescription:
          type: string
        fullDescription:
          type: string
        weather:
          type: string
        berth:
          type: string
        route:
          type: string
        tips:
          type: string
        marina:
          type: string
        food:
          type: string
        place:
          type: string
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        example: pl,en;q=0.9
      description: Preferred language for the response
    XTurnstileToken:
      name: X-Turnstile-Token
      in: header
      required: false
      description: >
        Cloudflare Turnstile CAPTCHA token. Required when CAPTCHA is enabled (TURNSTILE_SECRET_KEY
        is set).

        When the server has no secret key configured, CAPTCHA verification is disabled and this
        header is ignored.
      schema:
        type: string
        maxLength: 2048
        example: 0.abc123...
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
      description: Sort order (ascending or descending)
    SortChats:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdAt
          - updatedAt
          - name
        default: updatedAt
      description: Field to sort chats by
    SortComments:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdAt
          - updatedAt
        default: createdAt
      description: Field to sort comments by
    SortCruiseParticipants:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdAt
          - updatedAt
          - state
        default: createdAt
      description: Field to sort cruise participants by
    SortCruises:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdAt
          - departureDate
          - title
          - costPerPerson
          - vesselLength
          - vesselType
          - vesselYear
        default: departureDate
      description: Field to sort cruises by
    SortFriendRequests:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdAt
          - updatedAt
          - state
        default: createdAt
      description: Field to sort friend requests by
    SortFriends:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - name
          - createdAt
        default: name
      description: Field to sort friends by
    SortMessages:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdAt
          - updatedAt
        default: createdAt
      description: Field to sort messages by
    SortUsers:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - name
          - createdAt
        default: name
      description: Field to sort users by
  headers:
    X-RateLimit-Limit:
      description: The number of allowed requests in the current period
      schema:
        type: integer
        example: 1000
    X-RateLimit-Remaining:
      description: The number of requests left in the current period
      schema:
        type: integer
        example: 999
    X-RateLimit-Reset:
      description: The timestamp when the rate limit window resets (Unix timestamp)
      schema:
        type: integer
        example: 1642694400
  responses:
    BadRequest:
      description: Bad request
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            default:
              value:
                type: /errors/validation
                title: Bad Request
                status: 400
                detail: Request payload is malformed or unreadable
    Forbidden:
      description: Access denied
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AuthProblem'
          examples:
            sessionAccessForbidden:
              value:
                type: /errors/session-access-forbidden
                title: Session Access Forbidden
                status: 403
                detail: You are not allowed to access this session
            forbiddenRole:
              value:
                type: /errors/forbidden-role
                title: Forbidden
                status: 403
                detail: You do not have permission to perform this action
    NotFound:
      description: Resource not found
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            default:
              value:
                type: /errors/not-found
                title: Resource Not Found
                status: 404
                detail: The requested resource could not be found
    Unauthorized:
      description: Authentication error or invalid token
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AuthProblem'
          examples:
            invalidCredentials:
              value:
                type: /errors/invalid-credentials
                title: Invalid Credentials
                status: 401
                detail: The provided email or password is incorrect
            invalidRefreshToken:
              value:
                type: /errors/invalid-refresh-token
                title: Invalid Refresh Token
                status: 401
                detail: The provided refresh token is invalid or does not match the session
            refreshTokenExpired:
              value:
                type: /errors/refresh-token-expired
                title: Refresh Token Expired
                status: 401
                detail: The refresh token has expired and a new login is required
            invalidSession:
              value:
                type: /errors/invalid-session
                title: Invalid Session
                status: 401
                detail: The session is invalid or has been terminated
            authenticationRequired:
              value:
                type: /errors/authentication-required
                title: Authentication Required
                status: 401
                detail: Authentication is required to access this resource
    UnprocessableEntity:
      description: The request was well-formed but contains semantic errors
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            default:
              value:
                type: /errors/validation
                title: Validation Failed
                status: 422
                detail: The request contains semantic errors
                violations:
                  - propertyPath: departureDate
                    message: Departure date must be before arrival date
                  - propertyPath: maxParticipants
                    message: Maximum participants cannot exceed 20 for this cruise type
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        Retry-After:
          description: Number of seconds to wait before retrying
          schema:
            type: integer
            example: 60
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AuthProblem'
          examples:
            rateLimitExceeded:
              value:
                type: /errors/otp-rate-limit
                title: Rate Limit Exceeded
                status: 429
                detail: Too many requests. Please try again later.
