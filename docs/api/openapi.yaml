              $ref: '#/components/schemas/AdminRegenerateRequest'
      responses:
        '202':
          description: Regeneration jobs enqueued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRegenerateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /regions:
    get:
      operationId: listRegions
      tags: [regions]
      summary: Get flat list of regions
      description: |
        Returns a flat, UI-ready list of all sailing regions with localization support.

        When `lat` and `lng` coordinates are provided, returns only regions whose boundary
        contains that point, sorted from most specific (highest level) to broadest (lowest level).
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [hierarchy, popularity]
            default: popularity
          description: Sort method (ignored when coordinates are provided)
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: lat
          in: query
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          description: |
            Latitude for location-based filtering. When provided with `lng`,
            returns only regions whose boundary contains this point.
            Results are sorted from most specific (leaf) to broadest (root).
            Must be provided together with `lng` or not at all.
          example: 44.87
        - name: lng
          in: query
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          description: |
            Longitude for location-based filtering. When provided with `lat`,
            returns only regions whose boundary contains this point.
            Results are sorted from most specific (leaf) to broadest (root).
            Must be provided together with `lat` or not at all.
          example: 13.85
      security: []
      responses:
        '200':
          description: List of regions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionsList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /regions/tree:
    get:
      operationId: getRegionsTree
      tags: [regions]
      summary: Get hierarchical tree of regions
      description: Returns a nested tree structure of all sailing regions with localization support
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      security: []
      responses:
        '200':
          description: Tree structure of regions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionTreeRoot'
        '400':
          $ref: '#/components/responses/BadRequest'

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: Get post feed
      description: |
        Returns a paginated list of posts. By default, only `published` posts that are not effectively expired are returned.

        **Effective Expiration**: A post is "effectively expired" when `status = published` AND `expiresAt <= NOW()`.

        **Visibility Rules**:
        - Without `userId`: Only `published` posts that are NOT effectively expired. Non-published status filters return 422.
        - With `userId != currentUserId`: Only `published` posts that are NOT effectively expired. Non-published status filters return 422.
        - With `userId = currentUserId`: Author sees their effectively expired posts AND can filter by author-only statuses.

        **Region Filtering**: When `regionCode` is provided, posts are filtered by that region and all its descendants (subtree filtering via hierarchy).

        **Cross-Region Types**: Post types listed in `crossRegionTypes` bypass the `regionCode` filter and are returned from all regions.
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date-time
          description: |
            Filter posts created from this date (inclusive).
            Format: ISO 8601 with timezone (e.g., 2025-12-30T12:00:00Z).
            Dates without timezone return 422.
          example: '2025-01-01T00:00:00Z'
        - name: hashtag
          in: query
          schema:
            type: string
          description: Filter posts by hashtag (case-insensitive, without # prefix)
          example: 'sailing'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of posts to return
        - name: locationName
          in: query
          schema:
            type: string
          description: Filter posts by location name (case-insensitive substring match)
          example: 'split'
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of posts to skip
        - name: toDate
          in: query
          schema:
            type: string
            format: date-time
          description: |
            Filter posts created until this date (inclusive).
            Format: ISO 8601 with timezone (e.g., 2025-12-31T23:59:59Z).
            Dates without timezone return 422.
          example: '2025-12-31T23:59:59Z'
        - name: type
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PostType'
          style: form
          explode: true
          description: Filter by post type(s)
        - name: regionCode
          in: query
          schema:
            type: string
          description: |
            Filter by region code and all its descendants (subtree filtering via hierarchy).
            Returns 422 if the region code does not exist.
          example: 'ADR-HR'
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FilterablePostStatus'
          style: form
          explode: true
          description: |
            Filter by status(es). Supports multiple values.
            Default: only `published` posts are returned.

            **Important**: Without `userId`, the endpoint behaves as a general feed and ONLY returns `published` posts 
            (not effectively expired). If `status` filter contains any value other than `published`, the API returns 422.
            To query own `archived/expired/resolved` posts, you MUST use `userId=currentUserId`.

            Invalid status values (including 'deleted' and any non-existent status) return 422 validation error.
        - name: crossRegionTypes
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CrossRegionPostType'
          style: form
          explode: true
          description: |
            Evergreen post types that bypass regionCode filter and return from all regions.
            Only accepts: photo, place, food, spot, tips, route.
            Time-sensitive types (berth, weather, navigation_warning, help) are NOT allowed.
            Returns 422 if non-evergreen types are provided.
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
          description: |
            Filter posts by author ID. When specified, returns only posts by this user.
            For other users: only `published` posts that are NOT effectively expired are returned.
            For the requesting user (own posts): all non-deleted statuses are returned per `status` filter,
            including effectively expired posts.
            This replaces the deprecated `GET /users/{userId}/posts` endpoint.
        - name: lat
          in: query
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          description: |
            Latitude for location-based search. Must be provided together with `lng` and `distance`.
            When provided, only posts with coordinates within the specified distance are returned.
            Posts without coordinates are excluded.
          example: 43.508133
        - name: lng
          in: query
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          description: |
            Longitude for location-based search. Must be provided together with `lat` and `distance`.
          example: 16.440193
        - name: distance
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: |
            Search radius in kilometers (1-100). Must be provided together with `lat` and `lng`.
            Posts without coordinates are excluded when this filter is applied.
          example: 10
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/SortPosts'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Feed of posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostsList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            Validation failed. Possible causes:
            - Invalid regionCode (does not exist)
            - Invalid crossRegionTypes (contains non-evergreen types)
            - Invalid status filter (contains deleted, or non-published without userId=currentUserId)
            - Invalid date format (missing timezone)
            - Location parameters incomplete (lat, lng, distance must all be provided together)
            - sort=distance used without location parameters
          $ref: '#/components/responses/UnprocessableEntity'

    post:
