name: Inspect Android runner

on:
  workflow_dispatch:

jobs:
  inspect:
    name: Inspect Android SDK and AVD profiles
    runs-on: ubuntu-latest
    steps:
      - name: Print runner image details
        run: |
          echo "Image OS: ${ImageOS:-unknown}"
          echo "Image version: ${ImageVersion:-unknown}"
          echo "Runner OS: ${RUNNER_OS:-unknown}"
          echo "Runner arch: ${RUNNER_ARCH:-unknown}"
          uname -a
          lsb_release -a

      - name: Configure Android SDK paths
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/emulator" >> "${GITHUB_PATH}"

      - name: Print Android environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "JAVA_HOME=${JAVA_HOME:-unset}"
          echo "PATH=${PATH}"
          command -v java || true
          java -version || true
          command -v sdkmanager || true
          command -v avdmanager || true
          command -v emulator || true
          command -v adb || true
          find "${ANDROID_HOME}" -maxdepth 3 -type f \( -name sdkmanager -o -name avdmanager -o -name emulator -o -name adb \) 2>/dev/null | sort || true

      - name: Print Android tool versions
        run: |
          sdkmanager --version || true
          adb version || true
          emulator -version || true

      - name: List installed Android SDK packages
        run: sdkmanager --list_installed || true

      - name: List available AVD hardware profiles
        run: avdmanager list device || true

      - name: Highlight Pixel hardware profiles
        run: avdmanager list device | grep -i pixel || true
