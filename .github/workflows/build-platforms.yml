name: Build platforms

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests with coverage
        run: make coverage

      - name: Run lint
        run: make lint

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/jacoco/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.device }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: Medium Phone
            slug: medium-phone
            api-level: 34
            target: google_apis
            arch: x86_64
            profile: medium_phone
          - device: Medium Tablet
            slug: medium-tablet
            api-level: 34
            target: google_apis
            arch: x86_64
            profile: medium_tablet
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble debug APK
        run: make assemble-debug

      - name: Run instrumented tests on ${{ matrix.device }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: make connected-check

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ matrix.slug }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports-${{ matrix.slug }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
